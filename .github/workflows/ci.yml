name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: JavaScript syntax checks
        run: |
          node --check mccb-scoring.js
          node --check mccb-participant.js
          node --check research-storage.js
          node --check research-data.js
          node --check research-governance.js
          node --check research-session.js
          node --check original-ui-controller.js
          node --check server/research-backend.cjs
          node --check tests/verify-scoring.cjs
          node --check tests/verify-participant.cjs
          node --check tests/verify-research-data.cjs
          node --check tests/verify-storage.cjs
          node --check tests/verify-governance.cjs
          node --check tests/verify-backend.cjs
          node --check tests/verify-manifest.cjs
          node --check tests/verify-protocol-lock.cjs
          node --check tests/verify-original-ui-core.cjs
          node --check tests/validate-drivers.cjs
          node --check tests/validate-inline-scripts.cjs
          node --check tests/verify-ui.cjs
          node --check tests/browser-smoke.cjs
          node --check tests/full-battery.cjs

      - name: Portable full battery
        run: node tests/full-battery.cjs

      - name: UI and accessibility contracts
        run: node tests/verify-ui.cjs

      - name: Chromium browser E2E smoke
        run: node tests/browser-smoke.cjs

      - name: Research workspace/report/runtime contract
        shell: bash
        run: |
          test -f research-ui.css
          test -f research-storage.js
          test -f research-data.js
          test -f research-governance.js
          test -f research-session.js
          test -f original-ui-controller.js
          test -f participant-runner.html
          test -f data-governance.html
          test -f research-report.html
          test -f research-comparison.html
          test -f server/research-backend.cjs
          test -f task-manifest.json
          test -f protocol-lock.json
          test -f docs/README.md
          test -f docs/HISTORY_PURGE.md
          test -f docs/UI_UX_V2.md
          test -f docs/UI_V4_REFACTOR.md
          test -f docs/RESEARCH_DATA_MODEL.md
          test -f docs/BACKEND_V1.md
          grep -q '"protocolGovernance": "protocol-lock-v1"' task-manifest.json
          grep -q '"dataModelVersion": "research-data-model-1.1.0"' task-manifest.json
          grep -q '"storageArchitecture": "local-primary-http-replica-1.0.0"' task-manifest.json
          grep -q '"lockVersion": 1' protocol-lock.json
          grep -q "MODEL_VERSION='research-data-model-1.1.0'" research-data.js
          grep -q "STORAGE_ARCH_VERSION='local-primary-http-replica-1.0.0'" research-storage.js
          grep -q "Research Data Model v1.1" docs/RESEARCH_DATA_MODEL.md
          grep -q "Study → Site → Participant → Session → Attempt" docs/RESEARCH_DATA_MODEL.md
          grep -q "local-primary-http-replica-1.0.0" docs/BACKEND_V1.md
          grep -q "research-storage.js" participant-runner.html
          grep -q "research-data.js" participant-runner.html
          grep -q "protocolLockHash" participant-runner.html
          grep -q "manifestHash" participant-runner.html
          grep -q "applySessionGate" participant-runner.html
          grep -q "ResearchStorage.stageBundle" participant-runner.html
          grep -q "bootstrapOriginalHomepageModernCore" mccb-participant.js
          grep -q "ResearchSession.ensureSession" original-ui-controller.js
          grep -q "ResearchGovernance.validateBundle" original-ui-controller.js
          grep -q "MCCBScoring.getDomainSummary" original-ui-controller.js
          grep -q 'id="consentVersion"' data-governance.html
          grep -q 'id="replicaToken"' data-governance.html
          grep -q 'id="importFile"' data-governance.html
          grep -q 'id="hardDeleteBtn"' data-governance.html
          grep -q ".psy-exp-data/" .gitignore
          grep -q "PSY_EXP_API_TOKEN" server/research-backend.cjs
          grep -q "127.0.0.1" server/research-backend.cjs
          grep -q "认知研究任务" participant-runner.html
          grep -q "timerJitter" participant-runner.html
          grep -q "research-app" research-ui.css
          grep -q "overflow:auto" research-ui.css
          grep -q "research-ui.css?v=5.0.0" participant-runner.html
          grep -q "MCCB 综合认知报告" research-report.html
          grep -q "MCCB 多被试对比报告" research-comparison.html
          grep -q "MIN_REFERENCE_N=5" research-report.html
          grep -q "MIN_REFERENCE_N=5" research-comparison.html
          grep -q "非 MCCB T 分" research-report.html
          grep -q "reference group" research-comparison.html
          if grep -q "report-masthead\|selector-panel\|Cohort comparison\|Research report" research-report.html research-comparison.html; then
            echo "Later research-report/research-comparison UI shell must not reappear."
            exit 1
          fi
          grep -q "protocol_time_limit_reached_incomplete" pages/mccb-tmt.html
          if grep -q "timing_violation.*tmt_part_.*time_limit" pages/mccb-tmt.html; then
            echo "TMT protocol time limit must not be mislabeled as timing_violation."
            exit 1
          fi
          if grep -R -n --include='*.html' -E "user-scalable[[:space:]]*=[[:space:]]*no|maximum-scale[[:space:]]*=[[:space:]]*1([,.\"']|$)" pages; then
            echo "Task pages must not disable browser zoom."
            exit 1
          fi
          grep -q "referenceN" research-report.html
          grep -q "reference group" research-comparison.html
          grep -q "attemptHistory" mccb-participant.js
          grep -q "eligibleForResearchScoring" mccb-scoring.js
          grep -q "semantic_review_required" mccb-scoring.js
          grep -q "RUNTIME_VERSION" mccb-participant.js
          grep -q "TASK_TIMING_POLICY" mccb-participant.js
          grep -q "supportsTask" mccb-scoring.js
          grep -q "private-licensed-assets-required" task-manifest.json
          grep -q "mccb_mode.*user" mccb-participant.js

      - name: Protected material and obsolete-harness guard
        shell: bash
        run: |
          test ! -e "docs/7.简版MCCB操作者表格（A）_vlm.txt"
          test ! -e "docs/8.简版MCCB操作者表格（B）_vlm.txt"
          test ! -d tests/archive
          test ! -e tests/cpt_report.py
          if grep -R -n --exclude-dir=.git --exclude='private-stimuli.example.js' --exclude='verify-manifest.cjs' "WORD_LIST" pages docs tests; then
            echo "Protected/public word-list marker reappeared."
            exit 1
          fi
          if grep -R -n --exclude-dir=.git -E "C:/Users/|D:/Software/|agent-browser/bin" tests; then
            echo "Machine-specific path or obsolete browser harness reappeared."
            exit 1
          fi
          grep -q "../private/stimuli.js" pages/mccb-hvlt.html
          grep -q "../private/stimuli.js" pages/mccb-msceit.html

      - name: Guard against accidental pseudo-standardization regression
        shell: bash
        run: |
          if grep -n "百分位数.*T 分\|近似 T 分转换" mccb-scoring.js; then
            echo "Research scoring must not be relabeled as a T-score conversion."
            exit 1
          fi
          if grep -nE '/(110|50|24|36)([^0-9]|$)' mccb-scoring.js; then
            echo "Research domain scoring must not reintroduce arbitrary fixed-denominator scaling."
            exit 1
          fi
          if grep -nE '/(110|40|24|36|26)([^0-9]|$)' original-ui-controller.js; then
            echo "Original UI controller must not use arbitrary fixed-denominator scoring."
            exit 1
          fi
          if grep -nE 'd\.tScore|d\.percentile|近似 T 分转换' research-report.html research-comparison.html; then
            echo "Restored report UIs must use research-safe indices rather than pseudo-standardization."
            exit 1
          fi
          grep -q "research-cohort-rank-index" mccb-scoring.js
          grep -q "protocolSignature" mccb-scoring.js
