name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: JavaScript syntax checks
        run: |
          node --check mccb-scoring.js
          node --check mccb-participant.js
          node --check tests/verify-scoring.cjs
          node --check tests/verify-participant.cjs
          node --check tests/verify-manifest.cjs
          node --check tests/validate-drivers.cjs
          node --check tests/validate-inline-scripts.cjs
          node --check tests/verify-ui.cjs
          node --check tests/browser-smoke.cjs
          node --check tests/full-battery.cjs

      - name: Portable full battery
        run: node tests/full-battery.cjs

      - name: UI and accessibility contracts
        run: node tests/verify-ui.cjs

      - name: Chromium browser smoke
        run: node tests/browser-smoke.cjs

      - name: Research workspace/report/runtime contract
        shell: bash
        run: |
          test -f research-ui.css
          test -f participant-runner.html
          test -f research-report.html
          test -f research-comparison.html
          test -f task-manifest.json
          test -f docs/README.md
          test -f docs/HISTORY_PURGE.md
          test -f docs/UI_UX_V2.md
          grep -q "认知任务研究工作台" index.html
          grep -q "Researcher console" index.html
          grep -q "participant-runner.html" index.html
          grep -q "Participant session" participant-runner.html
          grep -q "timerJitter" participant-runner.html
          grep -q "research-app" research-ui.css
          grep -q "overflow:auto" research-ui.css
          grep -q "MIN_REFERENCE_N=5" research-report.html
          grep -q "MIN_REFERENCE_N=5" research-comparison.html
          grep -q "导出 CSV" research-comparison.html
          grep -q "protocol_time_limit_reached_incomplete" pages/mccb-tmt.html
          if grep -q "timing_violation.*tmt_part_.*time_limit" pages/mccb-tmt.html; then
            echo "TMT protocol time limit must not be mislabeled as timing_violation."
            exit 1
          fi
          if grep -R -n --include='*.html' -E "user-scalable[[:space:]]*=[[:space:]]*no|maximum-scale[[:space:]]*=[[:space:]]*1([,.\"']|$)" pages; then
            echo "Task pages must not disable browser zoom."
            exit 1
          fi
          if grep -q "MCCB 认知成套测验" index.html; then
            echo "Researcher Console must not regress to the legacy standardized-test framing."
            exit 1
          fi
          grep -q "RESEARCH PROTOTYPE" research-report.html
          grep -q "未应用经验证的 MCCB 常模" research-report.html
          grep -q "未应用经验证的 MCCB 常模" research-comparison.html
          grep -q "referenceN" research-report.html
          grep -q "reference group" research-comparison.html
          grep -q "attemptHistory" mccb-participant.js
          grep -q "eligibleForResearchScoring" mccb-scoring.js
          grep -q "semantic_review_required" mccb-scoring.js
          grep -q "RUNTIME_VERSION" mccb-participant.js
          grep -q "TASK_TIMING_POLICY" mccb-participant.js
          grep -q "supportsTask" mccb-scoring.js
          grep -q "private-licensed-assets-required" task-manifest.json
          grep -q "mccb_mode.*user" mccb-participant.js
          grep -q "research-report.html" comprehensive-report.html
          grep -q "research-comparison.html" comparison-report.html

      - name: Protected material and obsolete-harness guard
        shell: bash
        run: |
          test ! -e "docs/7.简版MCCB操作者表格（A）_vlm.txt"
          test ! -e "docs/8.简版MCCB操作者表格（B）_vlm.txt"
          test ! -d tests/archive
          test ! -e tests/cpt_report.py
          if grep -R -n --exclude-dir=.git --exclude='private-stimuli.example.js' --exclude='verify-manifest.cjs' "WORD_LIST" pages docs tests; then
            echo "Protected/public word-list marker reappeared."
            exit 1
          fi
          if grep -R -n --exclude-dir=.git -E "C:/Users/|D:/Software/|agent-browser/bin" tests; then
            echo "Machine-specific path or obsolete browser harness reappeared."
            exit 1
          fi
          grep -q "../private/stimuli.js" pages/mccb-hvlt.html
          grep -q "../private/stimuli.js" pages/mccb-msceit.html

      - name: Guard against accidental pseudo-standardization regression
        shell: bash
        run: |
          if grep -n "百分位数.*T 分\|近似 T 分转换" mccb-scoring.js; then
            echo "Research scoring must not be relabeled as a T-score conversion."
            exit 1
          fi
          if grep -nE '/(110|50|24|36)([^0-9]|$)' mccb-scoring.js; then
            echo "Research domain scoring must not reintroduce arbitrary fixed-denominator scaling."
            exit 1
          fi
          grep -q "research-cohort-rank-index" mccb-scoring.js
          grep -q "protocolSignature" mccb-scoring.js
