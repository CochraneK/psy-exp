<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MCCB MSCEIT 情绪管理测验</title>
<link rel="stylesheet" href="../mccb-common.css">
<script src="../mccb-participant.js"></script>
<style>
  /* ===== 页面特有样式 ===== */

  /* Welcome — 自定义配色（覆盖 common.css 的蓝绿主题为橙红主题） */
  #page-welcome .logo {
    width: 5rem; height: 5rem;
    background: linear-gradient(135deg, var(--color-warning), var(--color-danger));
    border-radius: 1.375rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.25rem; color: var(--text-on-accent);
    box-shadow: 0 8px 24px rgba(245,158,11,0.2);
  }
  #page-welcome .subtitle { max-width: 33.75rem; }
  .inst-box {
    background: var(--color-warning-bg); border-left: 0.25rem solid var(--color-warning);
    padding: 1rem 1.25rem; border-radius: 0.625rem; font-size: 0.875rem;
    color: var(--text-primary); text-align: left; max-width: 33.75rem; line-height: 1.7;
  }

  /* Test page — 卡片布局 */
  #page-test {
    flex-direction: column; padding: 1.25rem; gap: 1rem; justify-content: flex-start;
  }
  .test-card-container {
    background: var(--bg-card); border-radius: 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    width: 100%; max-width: 40rem;
    overflow: hidden;
  }
  .test-header-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.875rem 1.25rem; background: var(--bg-hover);
    border-bottom: 1px solid var(--border-light);
  }
  .test-header-bar .th-progress { font-size: 0.875rem; font-weight: 600; color: var(--text-primary); }
  .test-header-bar .th-progress span { color: var(--color-warning); }
  .test-header-bar .th-counter { font-size: 0.8125rem; color: var(--text-muted); }

  .scenario-area { padding: 1.75rem 1.5rem 0.75rem; }
  .scenario-area .scenario-label {
    font-size: 0.75rem; font-weight: 600; color: var(--color-warning); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 0.625rem;
  }
  .scenario-area .scenario-text { font-size: 1rem; line-height: 1.8; color: var(--text-primary); }
  .question-area { padding: 0 1.5rem 0.5rem; }
  .question-area .question-label { font-size: 0.875rem; font-weight: 600; color: var(--text-body); margin-bottom: 0.25rem; }
  .question-area .question-text { font-size: 0.9375rem; line-height: 1.7; color: var(--text-primary); }

  .options-area {
    padding: 0.5rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .option-btn {
    display: flex; align-items: flex-start; gap: 0.75rem;
    padding: 0.875rem 1rem;
    border: 2px solid var(--border-light);
    border-radius: 0.75rem;
    background: var(--bg-export);
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
    text-align: left;
    font-family: inherit;
    font-size: 0.875rem;
    line-height: 1.6;
    color: var(--text-primary);
    width: 100%;
  }
  @media (hover: hover) {
    .option-btn:hover { border-color: var(--color-warning); background: var(--color-warning-bg); }
  }
  .option-btn.selected {
    border-color: var(--color-warning);
    background: var(--color-warning-bg);
    box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
  }
  .option-btn .opt-letter {
    flex-shrink: 0;
    width: 1.625rem; height: 1.625rem;
    border-radius: 50%;
    background: var(--border-light);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.8125rem; color: var(--text-secondary);
    transition: background-color 0.2s, color 0.2s;
  }
  .option-btn.selected .opt-letter { background: var(--color-warning); color: var(--text-on-accent); }
  .option-btn.answered { cursor: default; }
  .option-btn.correct-answer { border-color: #22c55e; background: #f0fdf4; }
  .option-btn.correct-answer .opt-letter { background: #22c55e; color: var(--text-on-accent); }
  .option-btn.wrong-answer { border-color: var(--color-danger); background: var(--color-danger-bg); }
  .option-btn.wrong-answer .opt-letter { background: var(--color-danger); color: var(--text-on-accent); }

  .feedback-area { padding: 0 1.5rem 1.25rem; font-size: 0.875rem; line-height: 1.7; color: var(--text-secondary); min-height: 1.875rem; }
  .feedback-area .fb-title { font-weight: 600; color: var(--text-primary); }

  .action-area { padding: 0 1.5rem 1.5rem; display: flex; gap: 0.625rem; }

  /* 按钮悬停覆盖 — btn-success hover 颜色与 common.css 不同，btn-outline hover 使用橙色主题 */
  @media (hover: hover) {
    .btn-success:hover:not(:disabled) { background: #1e8449; }
    .btn-outline:hover:not(:disabled) { border-color: var(--color-warning); color: var(--color-warning); }
  }
  .btn:focus-visible, .option-btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

/* Wide mode: MSCEIT */
body.wide-mode .test-card-container { max-width: 70rem; }
body.wide-mode .scenario-area .scenario-text { font-size: 1.15rem; }
body.wide-mode .options-area { max-width: 50rem; align-self: center; width: 100%; }
body.wide-mode #page-test { padding: 1.75rem 2.5rem; }

</style>
</head>
<body>
<main id="app">
  <!-- Welcome -->
  <section id="page-welcome" class="page active">
    <header>
      <div class="logo">🤝</div>
      <h2>MSCEIT 情绪管理测验</h2>
    </header>
    <p class="subtitle">
      Mayer-Salovey-Caruso 情绪智力测验 — 管理情绪分支。<br>
      阅读每个情境描述，从选项中<strong>选择你认为最有效的情绪管理策略</strong>。
    </p>
    <div class="inst-box">
      <strong>规则：</strong>共 12 个情境。每个情境描述一个人物面临的情绪挑战，<br>
      你需要选择最有效的情绪管理方式。选择后无法更改，但会看到反馈解释。
    </div>
    <footer>
      <button type="button" class="btn btn-success" onclick="startTest()" style="margin-top:4px;">开始测验</button>
    </footer>
  </section>

  <!-- Test -->
  <section id="page-test" class="page">
    <div class="test-card-container">
      <div class="test-header-bar">
        <div class="th-progress">情境 <span id="progressNum">1</span> / 12</div>
        <div class="th-counter">已答: <span id="answeredCount">0</span></div>
      </div>
      <div class="scenario-area">
        <div class="scenario-label">情境描述</div>
        <div class="scenario-text" id="scenarioText">加载中...</div>
      </div>
      <div class="question-area">
        <div class="question-label">❓ 最有效的做法是：</div>
        <div class="question-text" id="questionText">加载中...</div>
      </div>
      <div class="options-area" id="optionsArea"></div>
      <div class="feedback-area" id="feedbackArea"></div>
      <footer class="action-area" id="actionArea">
        <button type="button" class="btn btn-primary" id="btnNext" onclick="nextScenario()" disabled>下一题</button>
      </footer>
    </div>
  </section>

  <!-- Result -->
  <section id="page-result" class="page page-result">
    <h2>📊 测验完成</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="ri-label">正确数</div>
        <div class="ri-value" id="resultCorrect">0</div>
      </div>
      <div class="result-item">
        <div class="ri-label">正确率</div>
        <div class="ri-value" id="resultAccuracy">0%</div>
      </div>
      <div class="result-item">
        <div class="ri-label">错误数</div>
        <div class="ri-value" id="resultErrors">0</div>
      </div>
      <div class="result-item full">
        <div class="ri-label">用时</div>
        <div class="ri-value" id="resultTime">0s</div>
      </div>
    </div>
    <aside class="norm-ref" id="normRef">
      <strong>参考解释：</strong><span id="normInterpretation">完成测试后查看参考解释</span>
    </aside>
    <footer class="result-actions" id="resultActions">
      <button type="button" class="btn btn-primary" onclick="showExport()">导出数据</button>
      <button type="button" class="btn btn-outline" onclick="backToWelcome()">返回首页</button>
    </footer>
  
  <p style="text-align:center;margin-top:20px;"><a href="../index.html" class="btn btn-outline" style="display:inline-block;padding:10px 28px;text-decoration:none;">← 返回测验中心</a></p></section>

  <!-- Overlay -->
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <div class="modal">
      <h3 id="modalTitle">提示</h3>
      <p id="modalBody">内容</p>
      <div id="modalActions"></div>
    </div>
  </div>
</main>
<script>
'use strict';

// === Mode (DEV / USER) ===
const urlParams = new URLSearchParams(window.location.search);
const MODE = urlParams.get('mode') || 'dev';
const IS_DEV = MODE === 'dev';
function applyModeStyles() {
  if (!IS_DEV) {
    const devEls = document.querySelectorAll('.count-badge, .feedback-area, .dev-hint, .progress-text, .quick-fb, #counterText, #devHintBacs');
    devEls.forEach(el => el.style.display = 'none');
  }
}

const STATE = {
  currentIndex: 0,
  answers: [],       // index of selected option
  results: [],       // true/false per item
  startTime: null,
  endTime: null,
  answered: false,
};

function navigateTo(pageId) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showOverlay(title, bodyText, actions) {
  const ov = document.getElementById('overlay');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = bodyText;
  const ac = document.getElementById('modalActions');
  ac.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = `btn ${a.cls || 'btn-primary'}`;
    btn.textContent = a.label;
    btn.onclick = () => { hideOverlay(); if (a.cb) a.cb(); };
    ac.appendChild(btn);
  });
  ov.classList.add('show');
  setTimeout(() => trapFocus(ov), 100);
}
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); document.querySelector('.btn, button:not(#overlay button)')?.focus(); }

function backToWelcome() {
  STATE.currentIndex = 0;
  navigateTo('page-welcome');
}

function startTest() {
  document.body.classList.add('testing-active');
  if (STATE.currentIndex > 0) return;  // 防抖保护：防止重复点击
  applyModeStyles();
    ParticipantManager.initFromUrl(); ParticipantManager.markInProgress('msceit');
  STATE.currentIndex = 0;
  STATE.answers = [];
  STATE.results = [];
  STATE.startTime = Date.now();
  STATE.endTime = null;
  STATE.answered = false;
  navigateTo('page-test');
  renderScenario(0);
}

function renderScenario(index) {
  STATE.answered = false;
  const s = SCENARIOS[index];

  document.getElementById('progressNum').textContent = index + 1;
  document.getElementById('answeredCount').textContent = STATE.results.filter(r => r !== undefined).length;
  document.getElementById('scenarioText').textContent = s.scenario;
  document.getElementById('questionText').textContent = s.question;
  document.getElementById('feedbackArea').innerHTML = '';
  document.getElementById('btnNext').disabled = true;

  const letters = ['A', 'B', 'C', 'D'];
  const optArea = document.getElementById('optionsArea');
  optArea.innerHTML = '';
  s.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => selectOption(i);
    btn.dataset.index = i;
    optArea.appendChild(btn);
  });
}

function selectOption(index) {
  if (STATE.answered) return;
  STATE.answered = true;

  const s = SCENARIOS[STATE.currentIndex];
  STATE.answers[STATE.currentIndex] = index;
  const isCorrect = index === s.correct;
  STATE.results[STATE.currentIndex] = isCorrect;

  // Visual feedback on buttons
  const buttons = document.querySelectorAll('#optionsArea .option-btn');
  buttons.forEach((btn, i) => {
    btn.classList.add('answered');
    if (IS_DEV) {
      if (i === s.correct) {
        btn.classList.add('correct-answer');
      } else if (i === index && !isCorrect) {
        btn.classList.add('wrong-answer');
      }
    }
    if (i === index) {
      btn.classList.add('selected');
    }
    btn.onclick = null; // disable further clicks
  });

  // Show feedback
  if (IS_DEV) {
    const fb = document.getElementById('feedbackArea');
    const icon = isCorrect ? '✅ 正确' : '❌ 不正确';
    fb.innerHTML = `<div class="fb-title">${icon}</div><div>${s.explanation}</div>`;
  }

  document.getElementById('answeredCount').textContent = STATE.results.filter(r => r !== undefined).length;
  document.getElementById('btnNext').disabled = false;
}

function nextScenario() {
  const next = STATE.currentIndex + 1;
  if (next >= SCENARIOS.length) {
    endTest();
  } else {
    STATE.currentIndex = next;
    renderScenario(next);
  }
}

function endTest() {
  document.body.classList.remove('testing-active');
  STATE.endTime = Date.now();
  navigateTo('page-result');

  const total = SCENARIOS.length;
  const correct = STATE.results.filter(r => r === true).length;
  const errors = total - correct;
  const acc = Math.round((correct / total) * 100);
  const elapsed = Math.round((STATE.endTime - STATE.startTime) / 1000);
  const mins = Math.floor(elapsed / 60);
  const secs = elapsed % 60;

  document.getElementById('resultCorrect').textContent = correct + '/' + total;
  document.getElementById('resultAccuracy').textContent = acc + '%';
  document.getElementById('resultErrors').textContent = errors;
  document.getElementById('resultTime').textContent = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;

  let cls, level;
  if (correct >= 10) { cls = 'good'; level = '优秀（≥10/12），情绪理解和情绪管理能力良好'; }
  else if (correct >= 7) { cls = 'good'; level = '正常范围（7-9/12）'; }
  else if (correct >= 4) { cls = 'warn'; level = '偏弱（4-6/12），提示社会认知能力可能需要关注'; }
  else { cls = 'bad'; level = '明显偏弱（<4/12），建议进一步评估'; }
  document.getElementById('resultCorrect').className = 'ri-value ' + cls;
  const interpEl = document.getElementById('normInterpretation');
  interpEl.textContent = '';
  const strong = document.createElement('strong');
  strong.textContent = `${correct}/${total}`;
  interpEl.appendChild(document.createTextNode('您答对了 '));
  interpEl.appendChild(strong);
  interpEl.appendChild(document.createTextNode(`（正确率 ${acc}%），用时 ${mins>0?mins+'分':''}${secs}秒。${level}`));
  saveToLocalStorage();
}

function saveToLocalStorage() {
  const data = {
    test: 'MCCB MSCEIT Managing Emotions',
    date: new Date().toISOString(),
    total: SCENARIOS.length,
    correct: STATE.results.filter(r => r === true).length,
    elapsed: Math.round((STATE.endTime - STATE.startTime) / 1000),
    responses: SCENARIOS.map((s, i) => ({
      scenario: s.scenario.substring(0, 60),
      selectedOption: STATE.answers[i],
      correctOption: s.correct,
      isCorrect: STATE.results[i],
    })),
  };
  try { localStorage.setItem('mccb-msceit-result', JSON.stringify(data)); } catch(e) {}
  ParticipantManager.saveResult('msceit', data);
}

function showExport() {
  const data = {
    test: 'MCCB MSCEIT Managing Emotions',
    date: new Date().toISOString(),
    total: SCENARIOS.length,
    correct: STATE.results.filter(r => r === true).length,
    elapsed: Math.round((STATE.endTime - STATE.startTime) / 1000),
    responses: SCENARIOS.map((s, i) => ({
      scenario: s.scenario.substring(0, 40) + '...',
      selectedOption: STATE.answers[i],
      correctOption: s.correct,
      isCorrect: STATE.results[i],
    })),
  };
  showOverlay('导出数据',
    `<div class="export-area">${JSON.stringify(data, null, 2)}</div>` +
    '<p style="font-size:13px;color:var(--text-muted);">可复制上述 JSON 数据保存或分享</p>',
    [{ label: '关闭', cls: 'btn-outline' },
     { label: '复制', cls: 'btn-primary', cb: () => {
       navigator.clipboard.writeText(JSON.stringify(data, null, 2)).catch(()=>{});
     }}
    ]
  );
}

// === 页面离开保护 ===
window.addEventListener('beforeunload', function(e) {
  if (document.getElementById('page-test').classList.contains('active')) {
    e.preventDefault();
    e.returnValue = '测试正在进行中，确定要离开吗？';
  }
});
document.addEventListener('visibilitychange', function() {
  if (document.hidden && document.getElementById('page-test').classList.contains('active')) {
    endTest();
  }
});

// === 模态框焦点陷阱 ===
function trapFocus(container) {
  const focusable = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  container.addEventListener('keydown', function handler(e) {
    if (e.key === 'Escape') {
      hideOverlay();
      return;
    }
    if (e.key !== 'Tab') return;
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
}
