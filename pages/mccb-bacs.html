<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>符号编码研究任务 · psy-exp</title>
<link rel="stylesheet" href="../mccb-common.css">
<script src="../mccb-participant.js"></script>
<style>
#page-test{flex-direction:column;padding:1rem;gap:.8rem;justify-content:flex-start}.key-legend{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;background:var(--bg-card);border-radius:12px;padding:12px;width:min(760px,100%);box-shadow:var(--shadow-sm)}.key-item{display:flex;gap:5px;align-items:center;padding:5px 8px;border-radius:8px;background:var(--bg-hover)}.key-item b{color:var(--accent-blue)}.timer-row{width:min(760px,100%);display:flex;gap:12px;align-items:center}.timer-number{font-family:var(--font-mono);font-size:1.35rem;font-weight:800;min-width:54px}.grid{width:min(760px,100%);display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;background:var(--bg-card);padding:12px;border-radius:12px;max-height:55vh;overflow:auto}.cell{text-align:center;background:var(--bg-export);border-radius:8px;padding:5px}.cell .sym{display:block;font-size:1.15rem;min-height:26px}.cell input{width:100%;min-width:0;height:34px;text-align:center;border:2px solid var(--border-light);border-radius:7px;font-weight:700}.cell input.ok{border-color:var(--color-success);background:var(--color-success-bg)}.cell input.bad{border-color:var(--color-danger);background:var(--color-danger-bg)}.research-note{font-size:13px;color:var(--text-secondary);line-height:1.6}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(760px,100%)}.summary>div{background:var(--bg-card);border:1px solid var(--border-light);border-radius:12px;padding:14px;text-align:center}.summary b{display:block;font-size:24px}@media(max-width:620px){.grid{grid-template-columns:repeat(6,1fr)}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main id="app">
<section id="page-welcome" class="page active"><header><div class="logo">🔣</div><h2>符号编码研究任务</h2></header><p class="subtitle">BACS-related digital research adaptation · 90 秒</p><div class="inst-box"><strong>规则：</strong>根据屏幕上方的符号—数字键，在 90 秒内尽可能快速准确地输入对应数字。本实现使用公开的合成符号序列，不声称与标准 BACS 纸笔施测等效。</div><p class="research-note">USER 模式不显示逐题正确/错误反馈；DEV 模式可用于软件调试。结果仅作为 raw/research data。</p><footer><button id="startBtn" class="btn btn-primary" type="button">开始任务</button></footer></section>
<section id="page-test" class="page"><div class="key-legend" id="keyLegend"></div><div class="timer-row"><div class="timer-number" id="timerDisplay">90.0 s</div><div class="timer-bar"><div class="fill" id="timerFill" style="width:100%"></div></div><div id="devCount" class="count-badge">正确 <span id="correctCount">0</span></div></div><div class="grid" id="grid"></div></section>
<section id="page-result" class="page page-result"><h2>📊 任务完成</h2><div class="summary"><div><b id="resultCorrect">0</b><span>正确</span></div><div><b id="resultAttempted">0</b><span>尝试</span></div><div><b id="resultErrors">0</b><span>错误</span></div><div><b id="resultAccuracy">0%</b><span>正确率</span></div></div><aside class="norm-ref"><strong>研究版提示：</strong><span>仅显示原始分与研究指标；未应用经验证的 MCCB 常模，不用于“正常/异常”判断或临床诊断解释。</span></aside><p class="research-note" id="resultMeta"></p><div class="actions"><button id="exportBtn" class="btn btn-primary" type="button">导出 JSON</button><a href="../index.html" class="btn btn-outline" style="text-decoration:none">返回测验中心</a></div></section>
</main>
<script>
'use strict';
const TEST_KEY='bacs',DURATION_MS=90000,PROTOCOL_VERSION='symbol-coding-synthetic-v1';
const MODE=new URLSearchParams(location.search).get('mode')||'user',IS_DEV=MODE==='dev';
const SYMBOLS=['△','○','◇','☆','□','♠','♣','♥','☼'];const KEY_MAP=new Map(SYMBOLS.map((s,i)=>[s,i+1]));const TOTAL_CELLS=110;
const state={sequence:[],answers:[],correct:0,attempted:0,running:false,deadline:null,result:null};const $=id=>document.getElementById(id);
function navigate(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active')}
function seededSequence(){let x=0x51f15e37;const out=[];for(let i=0;i<TOTAL_CELLS;i++){x^=x<<13;x^=x>>>17;x^=x<<5;out.push(SYMBOLS[(x>>>0)%SYMBOLS.length])}return out}
function renderKey(){const el=$('keyLegend');el.textContent='';for(const s of SYMBOLS){const item=document.createElement('span');item.className='key-item';item.append(document.createTextNode(s+' → '));const b=document.createElement('b');b.textContent=KEY_MAP.get(s);item.appendChild(b);el.appendChild(item)}}
function renderGrid(){const grid=$('grid');grid.textContent='';state.sequence.forEach((s,i)=>{const cell=document.createElement('div');cell.className='cell';const sym=document.createElement('span');sym.className='sym';sym.textContent=s;const input=document.createElement('input');input.inputMode='numeric';input.maxLength=1;input.dataset.i=i;input.addEventListener('input',onInput);cell.append(sym,input);grid.appendChild(cell)})}
function onInput(e){if(!state.running)return;const input=e.target,v=input.value;if(!/^[1-9]$/.test(v)){input.value='';return}const i=Number(input.dataset.i),ok=Number(v)===KEY_MAP.get(state.sequence[i]);state.answers[i]=Number(v);state.attempted++;if(ok)state.correct++;if(IS_DEV)input.className=ok?'ok':'bad';input.disabled=true;$('correctCount').textContent=state.correct;const next=document.querySelector('#grid input:not(:disabled)');if(next)next.focus()}
function start(){ParticipantManager.initFromUrl();if(!ParticipantManager.getCurrent()){alert('请先从测验中心选择/创建被试编号。');return}ParticipantManager.markInProgress(TEST_KEY);state.sequence=seededSequence();state.answers=new Array(TOTAL_CELLS).fill(null);state.correct=0;state.attempted=0;state.running=true;renderKey();renderGrid();$('devCount').style.display=IS_DEV?'':'none';navigate('page-test');const first=document.querySelector('#grid input');if(first)first.focus();state.deadline=ExperimentRuntime.deadline(DURATION_MS,{testKey:TEST_KEY,label:'bacs_90s_deadline',tickMs:50,onTick:({remainingMs})=>{$('timerDisplay').textContent=(remainingMs/1000).toFixed(1)+' s';$('timerFill').style.width=Math.max(0,Math.min(100,remainingMs/DURATION_MS*100))+'%';},onDone:end})}
function end(){if(!state.running)return;state.running=false;document.querySelectorAll('#grid input').forEach(i=>i.disabled=true);const errors=state.attempted-state.correct,accuracy=state.attempted?Math.round(state.correct/state.attempted*100):0;const result={test:'Symbol Coding Research Task',protocol:PROTOCOL_VERSION,date:new Date().toISOString(),durationMs:DURATION_MS,totalCells:TOTAL_CELLS,correct:state.correct,attempted:state.attempted,errors,accuracy,stimulusSequenceVersion:'fixed-xorshift32-51f15e37',responses:state.answers};ParticipantManager.saveResult(TEST_KEY,result);state.result=result;$('resultCorrect').textContent=result.correct;$('resultAttempted').textContent=result.attempted;$('resultErrors').textContent=result.errors;$('resultAccuracy').textContent=result.accuracy+'%';const qc=ParticipantManager.getSessionQc(TEST_KEY);$('resultMeta').textContent=`Protocol ${PROTOCOL_VERSION} · Session QC ${qc?qc.status:'unknown'} · max timer drift ${qc&&qc.qc?qc.qc.timerDriftMaxMs:0} ms`;navigate('page-result')}
function exportResult(){if(!state.result)return;const blob=new Blob([JSON.stringify(state.result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`symbol-coding-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)}
$('startBtn').addEventListener('click',start);$('exportBtn').addEventListener('click',exportResult);window.addEventListener('beforeunload',e=>{if(state.running){e.preventDefault();e.returnValue='任务正在进行中，确定离开吗？'}});
</script>
</body>
</html>
