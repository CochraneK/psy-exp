<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>空间序列研究任务</title><link rel="stylesheet" href="../mccb-common.css"><script src="../mccb-participant.js"></script><style>
.shell{width:min(700px,100%);margin:auto}.board{width:min(520px,88vw);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7%;margin:18px auto}.block{border:2px solid var(--border-light);border-radius:14px;background:var(--bg-card);cursor:pointer;transition:.12s}.block.flash{background:var(--accent-blue);transform:scale(1.05)}.block:disabled{cursor:default}.meta{font-size:13px;color:var(--text-secondary);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats>div{background:var(--bg-card);border:1px solid var(--border-light);border-radius:12px;padding:16px;text-align:center}.stats b{display:block;font-size:26px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style></head><body><main id="app">
<section id="welcome" class="page active"><div class="shell"><header><div class="logo">▦</div><h2>空间序列研究任务</h2></header><p class="subtitle">Spatial Span-related synthetic screen adaptation</p><div class="inst-box">方块会按顺序闪烁。每个长度做两个合成试次：一个按原顺序点击（forward），一个按逆序点击（reverse）。公开版本的序列由算法生成，不包含固定 WMS-III 材料。</div><p class="meta">该屏幕 3×3 任务不等同标准实体板施测；只输出 raw/research data。</p><footer><button id="start" class="btn btn-primary">开始</button></footer></div></section>
<section id="task" class="page"><div class="shell" style="text-align:center"><div class="test-status" id="label"></div><div class="board" id="board"></div><p class="meta" id="hint"></p></div></section>
<section id="result" class="page page-result"><h2>📊 任务完成</h2><div class="stats"><div><b id="correct">0</b><span>正确试次</span></div><div><b id="maxLevel">0</b><span>最高通过长度</span></div></div><aside class="norm-ref"><strong>研究版提示：</strong><span>仅显示原始分与研究指标；未应用经验证的 MCCB 常模，不用于“正常/异常”判断或临床诊断解释。</span></aside><p class="meta" id="resultMeta"></p><div class="actions"><button id="export" class="btn btn-primary">导出 JSON</button><a class="btn btn-outline" href="../index.html" style="text-decoration:none">返回测验中心</a></div></section>
</main><script>
'use strict';const TEST_KEY='spatial-span',PROTOCOL='synthetic-spatial-sequence-v1',LEVELS=[2,3,4,5,6,7,8],FLASH_MS=500,GAP_MS=250;const $=id=>document.getElementById(id);const state={levelIndex:0,phaseIndex:0,current:null,clicked:[],accepting:false,totalCorrect:0,maxLevel:0,logs:[],clock:null,result:null};
function nav(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active')}function rng(seed){let x=seed>>>0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function buildBoard(){const b=$('board');b.textContent='';for(let i=0;i<9;i++){const el=document.createElement('button');el.type='button';el.className='block';el.dataset.i=i;el.setAttribute('aria-label','空间方块 '+(i+1));el.onclick=()=>clickBlock(i);b.appendChild(el)}}
function sequence(level,phase){const r=rng(0x5aa50000+level*131+phase*37),out=[];while(out.length<level){const v=Math.floor(r()*9);if(out[out.length-1]!==v)out.push(v)}return out}
function start(){ParticipantManager.initFromUrl();if(!ParticipantManager.getCurrent()){alert('请先选择/创建被试编号。');return}ParticipantManager.markInProgress(TEST_KEY);state.levelIndex=0;state.phaseIndex=0;state.totalCorrect=0;state.maxLevel=0;state.logs=[];buildBoard();runTrial()}
function runTrial(){const level=LEVELS[state.levelIndex];if(level==null){finish();return}const direction=state.phaseIndex===0?'forward':'reverse';state.current=sequence(level,state.phaseIndex);state.clicked=[];state.accepting=false;nav('task');$('label').textContent=`长度 ${level} · ${direction==='forward'?'顺序':'逆序'}`;$('hint').textContent='观察方块闪烁…';const cycle=FLASH_MS+GAP_MS,total=state.current.length*cycle;let last=-1;state.clock=ExperimentRuntime.deadline(total,{testKey:TEST_KEY,label:`spatial_${direction}_${level}`,tickMs:35,onTick:({elapsedMs})=>{const i=Math.min(state.current.length-1,Math.floor(elapsedMs/cycle)),within=elapsedMs-i*cycle;document.querySelectorAll('.block').forEach(x=>x.classList.remove('flash'));if(within<FLASH_MS){const el=document.querySelector(`.block[data-i="${state.current[i]}"]`);if(el)el.classList.add('flash')}last=i;},onDone:()=>{document.querySelectorAll('.block').forEach(x=>x.classList.remove('flash'));state.accepting=true;$('hint').textContent=direction==='forward'?'请按原顺序点击':'请按逆序点击'}})}
function clickBlock(i){if(!state.accepting)return;state.clicked.push(i);const level=LEVELS[state.levelIndex],direction=state.phaseIndex===0?'forward':'reverse',target=direction==='forward'?state.current.slice():state.current.slice().reverse();if(state.clicked.length>=target.length){state.accepting=false;const ok=state.clicked.every((v,j)=>v===target[j]);if(ok){state.totalCorrect++;state.maxLevel=Math.max(state.maxLevel,level)}state.logs.push({level,direction,sequence:state.current.slice(),response:state.clicked.slice(),correct:ok});state.phaseIndex++;if(state.phaseIndex>=2){const recent=state.logs.slice(-2),passed=recent.some(x=>x.correct);state.phaseIndex=0;if(!passed){finish();return}state.levelIndex++}setTimeout(runTrial,250)}}
function finish(){const result={test:'Spatial Sequence Research Task',protocol:PROTOCOL,date:new Date().toISOString(),totalCorrect:state.totalCorrect,maxLevel:state.maxLevel,trials:state.logs};ParticipantManager.saveResult(TEST_KEY,result);state.result=result;$('correct').textContent=result.totalCorrect;$('maxLevel').textContent=result.maxLevel||'—';const qc=ParticipantManager.getSessionQc(TEST_KEY);$('resultMeta').textContent=`Protocol ${PROTOCOL} · synthetic 3×3 screen sequence · Session QC ${qc?qc.status:'unknown'}`;nav('result')}
function exportResult(){if(!state.result)return;const blob=new Blob([JSON.stringify(state.result,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='spatial-sequence-research.json';a.click();URL.revokeObjectURL(u)}
$('start').onclick=start;$('export').onclick=exportResult;
</script></body></html>
