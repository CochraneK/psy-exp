<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MCCB 空间广度测验 (Spatial Span)</title>
<link rel="stylesheet" href="../mccb-common.css">
<script src="../mccb-participant.js"></script>
<style>
  /* ===== 页面特有样式 ===== */

  /* Welcome — 自定义 Logo 渐变（橙黄主题） */
  #page-welcome .logo {
    width: 5rem; height: 5rem;
    background: linear-gradient(135deg, #e67e22, #f1c40f);
    border-radius: 1.375rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.25rem; color: var(--text-on-accent);
    box-shadow: 0 8px 24px rgba(230,126,34,0.2);
  }

  /* Test page — 空间广度棋盘 */
  #page-test { flex-direction: column; gap: 1rem; padding: 1.5rem; }

  .trial-header {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; max-width: 32.5rem;
  }
  .trial-info {
    font-size: 0.875rem; color: var(--text-secondary);
    background: var(--bg-card); padding: 0.5rem 1.25rem; border-radius: 1.25rem;
    box-shadow: var(--shadow-sm);
  }
  .trial-info span { color: var(--accent-blue); font-weight: 600; }

  .board-area {
    position: relative;
    width: 25rem; height: 20rem;
    max-width: 90vw; max-height: 55vh;
  }
  .spatial-block {
    position: absolute;
    width: 4.625rem; height: 4.625rem;
    border-radius: 0.75rem;
    background: var(--border-light);
    border: 3px solid var(--border-outline);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: 700; color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    font-family: var(--font-mono);
  }
  @media (hover: hover) { .spatial-block:hover { transform: scale(1.04); } }
  .spatial-block.lit {
    background: var(--accent-blue); border-color: var(--accent-blue-hover);
    color: var(--text-on-accent); box-shadow: 0 0 1.25rem rgba(52,152,219,0.5);
    transform: scale(1.08);
  }
  .spatial-block.selected {
    background: var(--color-success); border-color: var(--color-success-hover);
    color: var(--text-on-accent); box-shadow: 0 0 0.75rem rgba(39,174,96,0.4);
    transform: scale(1.05);
  }
  .spatial-block.wrong {
    background: var(--color-danger); border-color: var(--color-danger-hover);
    color: var(--text-on-accent);
  }
  .spatial-block.reveal-lit {
    background: #fbbf24; border-color: var(--color-warning);
    color: var(--text-primary); box-shadow: 0 0 0.75rem rgba(251,191,36,0.4);
  }
  .spatial-block:disabled { cursor: not-allowed; opacity: 0.7; }

  .status-text {
    font-size: 1rem; font-weight: 600; color: var(--text-body);
    min-height: 1.75rem;
  }
  .status-text.demonstrating { color: var(--accent-blue); }
  .status-text.waiting { color: var(--color-success); }
  .status-text.correct { color: var(--color-success-text); }
  .status-text.incorrect { color: var(--color-danger-hover); }

  /* Result — 各等级详情 */
  .per-level {
    display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;
    margin: 0.5rem 0;
  }
  .pl-item {
    padding: 0.375rem 0.875rem; border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 500;
    background: var(--bg-disabled); color: var(--text-secondary);
  }
  .pl-item.correct { background: var(--color-success-bg); color: #065f46; }
  .pl-item.incorrect { background: #fee2e2; color: #991b1b; }
  .pl-item.current { background: var(--bg-inst); color: #1e40af; }

  /* 焦点环 — 包含 .spatial-block */
  .btn:focus-visible, .spatial-block:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }

/* Wide mode: Spatial-Span */
body.wide-mode #page-test { gap: 1.25rem; padding: 2rem 3rem; }
body.wide-mode .grid-container { max-width: 45rem; }
body.wide-mode .spatial-block { width: 5rem; height: 5rem; font-size: 1.375rem; }
body.wide-mode #spanDisplay { font-size: 450%; }

</style>
</head>
<body>
<main id="app">
  <!-- Welcome -->
  <section id="page-welcome" class="page active">
    <header>
      <div class="logo">🧩</div>
      <h2>空间广度测验</h2>
    </header>
    <p class="subtitle">
      Spatial Span — 屏幕上会显示若干个方块，方块会<b>依次闪烁</b>。
      你需要<b>按照同样的顺序</b>点击这些方块。
    </p>
    <div class="inst-box">
      <strong>规则：</strong>先观察方块的闪烁顺序，待提示"请点击"后，按相同顺序点击方块。
      序列长度逐渐增加。测验将在连续 3 次答错后结束。
    </div>
    <footer>
      <button type="button" class="btn btn-primary" onclick="startTest()" style="margin-top:4px;">开始测验</button>
    </footer>
  </section>

  <!-- Test -->
  <section id="page-test" class="page" style="flex-direction:column;">
    <div class="trial-header">
      <div class="trial-info">第 <span id="trialLevel">0</span> 级 · 第 <span id="trialNum">0</span>/3 题</div>
    </div>
    <div class="board-area" id="boardArea"></div>
    <div class="status-text" id="statusText">准备中...</div>
  </section>

  <!-- Result -->
  <section id="page-result" class="page">
    <h2>📊 测验完成</h2>
    <div class="result-grid">
      <div class="result-item">
        <div class="ri-label">总正确数</div>
        <div class="ri-value" id="resultTotal">0</div>
      </div>
      <div class="result-item">
        <div class="ri-label">最高通过等级</div>
        <div class="ri-value" id="resultMaxLevel">0</div>
      </div>
      <div class="result-item full">
        <div class="ri-label">各等级作答情况</div>
        <div class="per-level" id="resultLevels"></div>
      </div>
    </div>
    <aside class="norm-ref" id="normRef">
      <strong>参考解释：</strong><span id="normInterpretation">完成测试后查看参考解释</span>
    </aside>
    <footer class="result-actions">
      <button type="button" class="btn btn-primary" onclick="showExport()">导出数据</button>
      <button type="button" class="btn btn-outline" onclick="backToWelcome()">返回首页</button>
    </footer>
  
  <p style="text-align:center;margin-top:20px;"><a href="../index.html" class="btn btn-outline" style="display:inline-block;padding:10px 28px;text-decoration:none;">← 返回测验中心</a></p></section>

  <!-- Overlay -->
  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
    <div class="modal">
      <h3 id="modalTitle">提示</h3>
      <p id="modalBody">内容</p>
      <div id="modalActions"></div>
    </div>
  </div>
</main>

<script>
'use strict';

// === Mode (DEV / USER) ===
const urlParams = new URLSearchParams(window.location.search);
const MODE = urlParams.get('mode') || 'dev';
const IS_DEV = MODE === 'dev';
function applyModeStyles() {
  if (!IS_DEV) {
    const devEls = document.querySelectorAll('.count-badge, .feedback-area, .dev-hint, .progress-text, .quick-fb, #counterText, #devHintBacs');
    devEls.forEach(el => el.style.display = 'none');
  }
}

// Classic Corsi block positions (percentage-based within board area)
const BLOCK_POSITIONS = [
  { left: 2, top: 48 },   // 1 - bottom left
  { left: 26, top: 12 },  // 2 - top center-left
  { left: 50, top: 0 },   // 3 - top center
  { left: 74, top: 18 },  // 4 - top right
  { left: 14, top: 68 },  // 5 - bottom center
  { left: 40, top: 42 },  // 6 - center
  { left: 64, top: 54 },  // 7 - center right
  { left: 0, top: 20 },   // 8 - top left
  { left: 86, top: 70 },  // 9 - bottom right
];

// 3 trials per level, sequences of block indices
const TRIALS = [
  // Level 2
  [{ seq: [1,4] }, { seq: [3,7] }, { seq: [6,2] }],
  // Level 3
  [{ seq: [2,5,8] }, { seq: [4,1,7] }, { seq: [6,3,9] }],
  // Level 4
  [{ seq: [1,7,3,8] }, { seq: [5,2,9,4] }, { seq: [8,6,1,3] }],
  // Level 5
  [{ seq: [3,8,5,1,7] }, { seq: [6,2,9,4,8] }, { seq: [2,7,4,9,1] }],
  // Level 6
  [{ seq: [7,1,8,4,6,2] }, { seq: [3,9,5,1,8,4] }, { seq: [5,7,2,9,3,6] }],
  // Level 7
  [{ seq: [8,3,6,1,9,5,2] }, { seq: [4,7,2,8,5,1,9] }, { seq: [6,1,7,3,9,4,8] }],
  // Level 8
  [{ seq: [2,9,4,6,1,8,3,5] }, { seq: [7,3,8,2,5,9,4,6] }, { seq: [1,6,4,9,7,2,8,3] }],
];

const STATE = {
  trialIndex: 0,
  currentLevel: 0,
  results: [],
  streakWrong: 0,
  totalCorrect: 0,
  userClicks: [],
  isDemonstrating: false,
  isWaitingInput: false,
  timerId: null,
  answered: false,
};

function navigateTo(pageId) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showOverlay(title, bodyText, actions) {
  const ov = document.getElementById('overlay');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = bodyText;
  const ac = document.getElementById('modalActions');
  ac.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = `btn ${a.cls || 'btn-primary'}`;
    btn.textContent = a.label;
    btn.onclick = () => { hideOverlay(); if (a.cb) a.cb(); };
    ac.appendChild(btn);
  });
  ov.classList.add('show');
  setTimeout(() => trapFocus(ov), 100);
}
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); document.querySelector('.btn, button:not(#overlay button)')?.focus(); }

function backToWelcome() {
  // Clean up any running timers
  if (STATE.demoInterval) { clearInterval(STATE.demoInterval); STATE.demoInterval = null; }
  if (STATE.demoTimeout) { clearTimeout(STATE.demoTimeout); STATE.demoTimeout = null; }
  if (STATE.timerId) { clearTimeout(STATE.timerId); STATE.timerId = null; }
  navigateTo('page-welcome');
}

function createBoard() {
  const board = document.getElementById('boardArea');
  board.innerHTML = '';
  // Make blocks slightly smaller on small screens
  const isSmall = window.innerWidth < 480;
  const size = isSmall ? 56 : 74;
  BLOCK_POSITIONS.forEach((pos, idx) => {
    const div = document.createElement('div');
    div.className = 'spatial-block';
    div.dataset.idx = idx + 1;
    div.textContent = idx + 1;
    div.style.left = `calc(${pos.left}% - ${size/2}px)`;
    div.style.top = `calc(${pos.top}% - ${size/2}px)`;
    div.style.width = size + 'px';
    div.style.height = size + 'px';
    div.style.fontSize = isSmall ? '16px' : '20px';
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');
    div.addEventListener('click', () => onBlockClick(idx + 1));
    div.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onBlockClick(idx + 1); } });
    board.appendChild(div);
  });
}

function resetBlocks() {
  document.querySelectorAll('.spatial-block').forEach(b => {
    b.classList.remove('lit', 'selected', 'wrong', 'reveal-lit');
    b.disabled = true;
  });
}

function startTest() {
  if (STATE.isWaitingInput || STATE.isDemonstrating) return;
  document.body.classList.add('testing-active');
  STATE.trialIndex = 0;
  STATE.currentLevel = 0;
  STATE.results = [];
  STATE.streakWrong = 0;
  STATE.totalCorrect = 0;
  STATE.userClicks = [];
  STATE.answered = false;
  STATE.isDemonstrating = false;
  STATE.isWaitingInput = false;

  createBoard();
  applyModeStyles();
    ParticipantManager.initFromUrl(); ParticipantManager.markInProgress('spatial-span');
  navigateTo('page-test');
  setTimeout(() => showNextTrial(), 500);
}

function showNextTrial() {
  if (STATE.currentLevel >= TRIALS.length) {
    endTest();
    return;
  }

  const level = STATE.currentLevel;
  const trialIdx = STATE.trialIndex;
  const trial = TRIALS[level][trialIdx];
  if (!trial) {
    endTest();
    return;
  }

  STATE.answered = false;
  STATE.userClicks = [];

  document.getElementById('trialLevel').textContent = level + 2;
  document.getElementById('trialNum').textContent = trialIdx + 1;

  resetBlocks();
  const st = document.getElementById('statusText');
  st.className = 'status-text demonstrating';
  st.textContent = '👀 观察闪烁顺序...';

  // Disable all blocks
  document.querySelectorAll('.spatial-block').forEach(b => { b.disabled = true; });

  STATE.isDemonstrating = true;
  STATE.isWaitingInput = false;

  // Light up blocks in sequence
  const seq = trial.seq;
  let i = 0;
  // Clear previous interval if any
  if (STATE.demoInterval) { clearInterval(STATE.demoInterval); }
  STATE.demoInterval = setInterval(() => {
    // Turn off all lit
    document.querySelectorAll('.spatial-block').forEach(b => b.classList.remove('lit'));

    if (i >= seq.length) {
      clearInterval(STATE.demoInterval);
      STATE.demoInterval = null;
      STATE.isDemonstrating = false;
      // After demonstration, wait briefly then enable input
      STATE.demoTimeout = setTimeout(() => {
        st.className = 'status-text waiting';
        st.textContent = '✋ 请按顺序点击方块！';
        document.querySelectorAll('.spatial-block').forEach(b => { b.disabled = false; });
        STATE.isWaitingInput = true;
      }, 500);
      return;
    }

    const blockIdx = seq[i] - 1; // 0-based
    const blocks = document.querySelectorAll('.spatial-block');
    blocks[blockIdx].classList.add('lit');
    i++;
  }, 900);
}

function onBlockClick(idx) {
  if (!STATE.isWaitingInput || STATE.answered) return;
  const block = document.querySelector(`.spatial-block[data-idx="${idx}"]`);
  if (!block || block.disabled) return;

  // Disable this block so it can't be clicked again
  block.disabled = true;
  block.classList.add('selected');
  STATE.userClicks.push(idx);

  // Check against expected sequence
  const trial = TRIALS[STATE.currentLevel][STATE.trialIndex];
  const expected = trial.seq;

  if (STATE.userClicks.length === expected.length) {
    // All clicks done - check answer
    STATE.answered = true;
    STATE.isWaitingInput = false;
    document.querySelectorAll('.spatial-block').forEach(b => { b.disabled = true; });

    const correct = STATE.userClicks.every((c, i) => c === expected[i]);

    const st = document.getElementById('statusText');
    if (correct) {
      if (IS_DEV) {
        st.className = 'status-text correct';
        st.textContent = '✅ 正确！';
      } else {
        st.className = 'status-text waiting';
        st.textContent = '✅ 正确！';
      }
      STATE.totalCorrect++;
      STATE.streakWrong = 0;
    } else {
      if (IS_DEV) {
        st.className = 'status-text incorrect';
        st.textContent = '❌ 不正确';
      } else {
        st.className = 'status-text waiting';
        st.textContent = '继续...';
      }
      STATE.streakWrong++;
      // Mark wrong blocks (DEV only)
      if (IS_DEV) {
        STATE.userClicks.forEach((c, i) => {
          const b = document.querySelector(`.spatial-block[data-idx="${c}"]`);
          if (c !== expected[i]) b.classList.add('wrong');
        });
      }
      // Reveal expected sequence (DEV only)
      if (IS_DEV) {
        setTimeout(() => {
          expected.forEach((e, i) => {
            const b = document.querySelector(`.spatial-block[data-idx="${e}"]`);
            setTimeout(() => b.classList.add('reveal-lit'), i * 300);
          });
        }, 300);
      }
    }

    STATE.results.push({
      level: STATE.currentLevel + 2,
      trial: STATE.trialIndex + 1,
      correct,
      userAnswer: [...STATE.userClicks],
      expected: [...expected],
    });

    // Next trial
    setTimeout(() => {
      if (STATE.streakWrong >= 3) { endTest(); return; }

      STATE.trialIndex++;
      const levelTrials = TRIALS[STATE.currentLevel];
      if (STATE.trialIndex >= levelTrials.length) {
        STATE.currentLevel++;
        STATE.trialIndex = 0;
        STATE.streakWrong = 0;
      }
      showNextTrial();
    }, correct ? 1200 : 2000);
  }
}

function endTest() {
  document.body.classList.remove('testing-active');
  STATE.isDemonstrating = false;
  STATE.isWaitingInput = false;

  document.getElementById('resultTotal').textContent = STATE.totalCorrect;
  const maxLvl = Math.min(STATE.currentLevel + 2, TRIALS.length + 1);
  document.getElementById('resultMaxLevel').textContent = `第 ${maxLvl} 级`;

  const levelsContainer = document.getElementById('resultLevels');
  levelsContainer.innerHTML = '';
  for (let l = 0; l < TRIALS.length; l++) {
    const lvlResults = STATE.results.filter(r => r.level === l + 2);
    const correctCount = lvlResults.filter(r => r.correct).length;
    const totalCount = lvlResults.length;
    let cls = 'pl-item';
    if (correctCount === totalCount && totalCount > 0) cls += ' correct';
    else if (correctCount < totalCount && totalCount > 0) cls += ' incorrect';
    if (l === STATE.currentLevel) cls += ' current';
    levelsContainer.innerHTML += `<span class="${cls}">${l + 2}级: ${correctCount}/${totalCount}</span>`;
  }

  const score = STATE.totalCorrect;
  const maxPossible = TRIALS.reduce((s, lvl) => s + lvl.length, 0);
  let cls;
  let pct = score / maxPossible;
  let level;
  if (pct >= 0.75) { level = '正常范围'; cls = 'good'; }
  else if (pct >= 0.5) { level = '偏低，提示空间工作记忆可能存在轻度下降'; cls = 'warn'; }
  else { level = '明显偏低，建议进一步评估'; cls = 'bad'; }
  document.getElementById('resultTotal').className = 'ri-value ' + cls;
  document.getElementById('normInterpretation').textContent =
    `总正确数 ${score}/${maxPossible}。${level}`;

  saveToLocalStorage();
  navigateTo('page-result');
}

function saveToLocalStorage() {
  const data = {
    test: 'MCCB Spatial Span',
    date: new Date().toISOString(),
    totalCorrect: STATE.totalCorrect,
    maxLevel: Math.min(STATE.currentLevel + 2, TRIALS.length + 1),
    results: STATE.results,
  };
  try { localStorage.setItem('mccb-spatial-span-result', JSON.stringify(data)); } catch(e) {}
  ParticipantManager.saveResult('spatial-span', data);
}

function showExport() {
  const data = {
    test: 'MCCB Spatial Span',
    date: new Date().toISOString(),
    totalCorrect: STATE.totalCorrect,
    maxLevel: Math.min(STATE.currentLevel + 2, TRIALS.length + 1),
    results: STATE.results,
  };
  showOverlay('导出数据',
    `<div class="export-area">${JSON.stringify(data, null, 2)}</div>` +
    '<p style="font-size:13px;color:var(--text-muted);">可复制上述 JSON 数据保存或分享</p>',
    [{ label: '关闭', cls: 'btn-outline' },
     { label: '复制', cls: 'btn-primary', cb: () => {
       navigator.clipboard.writeText(JSON.stringify(data, null, 2)).catch(()=>{});
     }}
    ]
  );
}

// === 页面离开保护 ===
window.addEventListener('beforeunload', function(e) {
  if (STATE.isDemonstrating || STATE.isWaitingInput) {
    e.preventDefault();
    e.returnValue = '测试正在进行中，确定要离开吗？';
  }
});
document.addEventListener('visibilitychange', function() {
  if (document.hidden && (STATE.isDemonstrating || STATE.isWaitingInput)) {
    endTest();
  }
});

// === 模态框焦点陷阱 ===
function trapFocus(container) {
  const focusable = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (focusable.length === 0) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  container.addEventListener('keydown', function handler(e) {
    if (e.key === 'Escape') {
      hideOverlay();
      return;
    }
    if (e.key !== 'Tab') return;
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });
}

// === Wide Mode Toggle ===
(function(){try{if(window.ParticipantManager)ParticipantManager.initFromUrl();}catch(e){}var b=document.createElement('button');b.id='wm-toggle';b.textContent='⛶';
b.title='切换宽屏模式';var w=localStorage.getItem('mccb-wide')==='1';
if(w){document.body.classList.add('wide-mode');b.classList.add('wm-on');}
b.onclick=function(){document.body.classList.toggle('wide-mode');
b.classList.toggle('wm-on');localStorage.setItem('mccb-wide',
document.body.classList.contains('wide-mode')?'1':'0');};
document.body.appendChild(b);})();
</script>
</body>
</html>
