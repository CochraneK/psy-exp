<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>迷宫规划研究任务</title><link rel="stylesheet" href="../mccb-common.css"><script src="../mccb-participant.js"></script><style>
.shell{width:min(760px,100%);margin:auto}.canvas-wrap{width:min(620px,92vw);margin:12px auto;aspect-ratio:1;border:1px solid var(--border-light);background:#fff}.canvas-wrap canvas{width:100%;height:100%;display:block}.controls{display:grid;grid-template-columns:repeat(3,58px);grid-template-areas:". up ." "left down right";gap:6px;justify-content:center;margin-top:10px}.controls button{height:50px}.up{grid-area:up}.left{grid-area:left}.down{grid-area:down}.right{grid-area:right}.meta{font-size:13px;color:var(--text-secondary);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats>div{background:var(--bg-card);border:1px solid var(--border-light);border-radius:12px;padding:14px;text-align:center}.stats b{display:block;font-size:24px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}@media(max-width:560px){.stats{grid-template-columns:1fr}}
</style></head><body><main id="app">
<section id="welcome" class="page active"><div class="shell"><header><div class="logo">🧩</div><h2>迷宫规划研究任务</h2></header><p class="subtitle">NAB Mazes-related synthetic planning task</p><div class="inst-box">使用方向键或屏幕按钮，从左上角走到右下角。7 个迷宫全部由确定性算法生成，不包含固定 NAB 迷宫版式。分数基于实际路径相对最短路径的效率。</div><p class="meta">这是推理/规划的研究适配，不使用 NAB 正式材料、计分规则或常模。</p><footer><button id="start" class="btn btn-primary">开始</button></footer></div></section>
<section id="task" class="page"><div class="shell"><div class="test-status" id="label"></div><div class="canvas-wrap"><canvas id="canvas" width="620" height="620"></canvas></div><div class="controls"><button class="btn btn-outline up" data-dir="U">↑</button><button class="btn btn-outline left" data-dir="L">←</button><button class="btn btn-outline down" data-dir="D">↓</button><button class="btn btn-outline right" data-dir="R">→</button></div><p class="meta" id="taskMeta"></p></div></section>
<section id="result" class="page page-result"><h2>📊 任务完成</h2><div class="stats"><div><b id="score">0</b><span>效率总分 / 26</span></div><div><b id="completed">0</b><span>完成迷宫</span></div><div><b id="time">0</b><span>总用时（秒）</span></div></div><aside class="norm-ref"><strong>研究版提示：</strong><span>仅显示原始分与研究指标；未应用经验证的 MCCB 常模，不用于“正常/异常”判断或临床诊断解释。</span></aside><p class="meta" id="resultMeta"></p><div class="actions"><button id="export" class="btn btn-primary">导出 JSON</button><a class="btn btn-outline" href="../index.html" style="text-decoration:none">返回测验中心</a></div></section>
</main><script>
'use strict';const TEST_KEY='mazes',PROTOCOL='generated-perfect-mazes-v1',SIZES=[5,6,7,8,9,10,11],WEIGHTS=[2,3,3,4,4,5,5];const $=id=>document.getElementById(id);const state={index:0,maze:null,pos:0,moves:0,start:0,details:[],result:null};
function nav(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active')}function rng(seed){let x=seed>>>0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function generate(n,seed){const cells=Array.from({length:n*n},()=>({U:1,R:1,D:1,L:1})),vis=new Set([0]),stack=[0],r=rng(seed),dirs=[['U',0,-1,'D'],['R',1,0,'L'],['D',0,1,'U'],['L',-1,0,'R']];while(stack.length){const cur=stack[stack.length-1],x=cur%n,y=Math.floor(cur/n),choices=[];for(const d of dirs){const nx=x+d[1],ny=y+d[2],ni=ny*n+nx;if(nx>=0&&ny>=0&&nx<n&&ny<n&&!vis.has(ni))choices.push([d,ni])}if(!choices.length){stack.pop();continue}const [d,ni]=choices[Math.floor(r()*choices.length)];cells[cur][d[0]]=0;cells[ni][d[3]]=0;vis.add(ni);stack.push(ni)}return{n,cells}}
function shortest(maze){const q=[[0,0]],seen=new Set([0]),dirs=[['U',0,-1],['R',1,0],['D',0,1],['L',-1,0]];while(q.length){const [i,d]=q.shift();if(i===maze.n*maze.n-1)return d;const x=i%maze.n,y=Math.floor(i/maze.n);for(const [k,dx,dy] of dirs){if(maze.cells[i][k])continue;const nx=x+dx,ny=y+dy,ni=ny*maze.n+nx;if(!seen.has(ni)){seen.add(ni);q.push([ni,d+1])}}}return null}
function draw(){const c=$('canvas'),ctx=c.getContext('2d'),n=state.maze.n,s=c.width/n;ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#1f2937';ctx.lineWidth=Math.max(2,7/n);for(let i=0;i<n*n;i++){const x=(i%n)*s,y=Math.floor(i/n)*s,w=state.maze.cells[i];ctx.beginPath();if(w.U){ctx.moveTo(x,y);ctx.lineTo(x+s,y)}if(w.R){ctx.moveTo(x+s,y);ctx.lineTo(x+s,y+s)}if(w.D){ctx.moveTo(x,y+s);ctx.lineTo(x+s,y+s)}if(w.L){ctx.moveTo(x,y);ctx.lineTo(x,y+s)}ctx.stroke()}ctx.fillStyle='#10b981';ctx.fillRect(c.width-s+4,c.height-s+4,s-8,s-8);const px=(state.pos%n)*s+s/2,py=Math.floor(state.pos/n)*s+s/2;ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(px,py,Math.max(6,s*.18),0,Math.PI*2);ctx.fill()}
function start(){ParticipantManager.initFromUrl();if(!ParticipantManager.getCurrent()){alert('请先选择/创建被试编号。');return}ParticipantManager.markInProgress(TEST_KEY);state.index=0;state.details=[];nav('task');loadMaze()}
function loadMaze(){const n=SIZES[state.index];if(!n){finish();return}state.maze=generate(n,0x9e370000+state.index*997);state.pos=0;state.moves=0;state.start=performance.now();$('label').textContent=`迷宫 ${state.index+1} / ${SIZES.length} · ${n}×${n}`;$('taskMeta').textContent='蓝点为当前位置，绿色为终点。';draw()}
function move(dir){if(!state.maze)return;const i=state.pos,n=state.maze.n;if(state.maze.cells[i][dir])return;const delta={U:-n,R:1,D:n,L:-1}[dir];state.pos+=delta;state.moves++;draw();if(state.pos===n*n-1){const elapsed=performance.now()-state.start,opt=shortest(state.maze),eff=opt/Math.max(opt,state.moves),weight=WEIGHTS[state.index],score=weight*eff;state.details.push({maze:state.index+1,size:n,moves:state.moves,optimalMoves:opt,efficiency:eff,weight,score,elapsedMs:Math.round(elapsed)});state.index++;state.maze=null;setTimeout(loadMaze,300)}}
function finish(){const totalScore=state.details.reduce((s,x)=>s+x.score,0),totalTime=state.details.reduce((s,x)=>s+x.elapsedMs,0)/1000,result={test:'Generated Maze Planning Research Task',protocol:PROTOCOL,date:new Date().toISOString(),totalScore:Math.round(totalScore*100)/100,maxScore:26,completed:state.details.length,completedDetails:state.details,totalTime:Math.round(totalTime*10)/10};ParticipantManager.saveResult(TEST_KEY,result);state.result=result;$('score').textContent=result.totalScore;$('completed').textContent=result.completed;$('time').textContent=result.totalTime;const qc=ParticipantManager.getSessionQc(TEST_KEY);$('resultMeta').textContent=`Protocol ${PROTOCOL} · deterministic generated mazes · Session QC ${qc?qc.status:'unknown'}`;nav('result')}
function exportResult(){if(!state.result)return;const blob=new Blob([JSON.stringify(state.result,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='generated-mazes-research.json';a.click();URL.revokeObjectURL(u)}
$('start').onclick=start;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));document.addEventListener('keydown',e=>{const k={ArrowUp:'U',ArrowRight:'R',ArrowDown:'D',ArrowLeft:'L'}[e.key];if(k){e.preventDefault();move(k)}});$('export').onclick=exportResult;
</script></body></html>
