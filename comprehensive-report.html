<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCCB 综合认知报告</title>
<link rel="stylesheet" href="mccb-common.css">
<style>
  /* ===== 页面布局 ===== */
  body { margin:0; background:var(--bg-page,#f0f2f5); min-height:100vh; }
  #app { max-width:1200px; margin:0 auto; padding:24px; }
  
  /* ===== 顶部栏 ===== */
  .header {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    background:var(--bg-card,#fff); border-radius:var(--radius-lg,12px);
    padding:16px 24px; box-shadow:var(--shadow-sm);
    margin-bottom:24px;
  }
  .header h1 {
    margin:0; font-size:22px; color:var(--text-primary,#1a1a2e);
    flex:1;
  }
  .header h1 small {
    font-size:14px; font-weight:400; color:var(--text-muted,#94a3b8);
    margin-left:8px;
  }
  .header select {
    padding:8px 14px; border:2px solid var(--border-light,#e2e8f0);
    border-radius:var(--radius-md,8px); font-size:15px;
    background:var(--bg-input,#fff); color:var(--text-primary);
    min-width:200px; cursor:pointer;
  }
  .header select:focus {
    border-color:var(--accent-blue,#3b82f6); outline:none;
  }
  .norm-badge {
    margin-top:4px; font-size:12px; color:var(--text-muted,#64748b);
    background:var(--color-warning-bg,#fef3c7); border:1px solid var(--border-light,#e2e8f0);
    border-radius:var(--radius-pill,999px); padding:3px 10px; display:inline-block; width:fit-content;
  }
  .header .actions { display:flex; gap:8px; }
  .header button {
    padding:8px 18px; border:none; border-radius:var(--radius-md,8px);
    font-size:14px; cursor:pointer; transition:background .2s;
  }
  .btn-primary {
    background:var(--accent-blue,#3b82f6); color:var(--text-on-accent,#fff);
  }
  .btn-primary:hover { background:var(--accent-blue-hover,#2563eb); }
  .btn-outline {
    background:transparent; color:var(--text-primary);
    border:2px solid var(--border-light,#e2e8f0);
  }
  .btn-outline:hover { border-color:var(--accent-blue); color:var(--accent-blue); }
  .btn-sm { padding:6px 14px; font-size:13px; }
  .btn-success {
    background:var(--color-success-text,#16a34a); color:var(--text-on-accent,#fff);
  }
  .btn-success:hover { background:var(--color-success-hover,#15803d); }

  /* ===== 空状态 ===== */
  .empty-state {
    text-align:center; padding:80px 24px;
    color:var(--text-muted,#94a3b8);
  }
  .empty-state .icon { font-size:64px; margin-bottom:16px; }
  .empty-state h2 { color:var(--text-secondary,#64748b); margin:0 0 8px; }

  /* ===== 报告主区域 ===== */
  #reportArea { display:none; }
  #reportArea.visible { display:block; }

  /* ===== 被试信息卡片 ===== */
  .subject-card {
    background:var(--bg-card,#fff); border-radius:var(--radius-lg,12px);
    padding:20px 24px; box-shadow:var(--shadow-sm); margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
    gap:12px;
  }
  .subject-card .info { display:flex; gap:24px; flex-wrap:wrap; }
  .subject-card .info-item { text-align:center; }
  .subject-card .info-item .value {
    font-size:24px; font-weight:700; color:var(--text-primary);
  }
  .subject-card .info-item .label {
    font-size:13px; color:var(--text-muted,#94a3b8); margin-top:2px;
  }

  /* ===== 雷达图容器 ===== */
  .chart-section {
    background:var(--bg-card,#fff); border-radius:var(--radius-lg,12px);
    padding:24px; box-shadow:var(--shadow-sm); margin-bottom:20px;
  }
  .chart-section h2 {
    margin:0 0 16px; font-size:18px; color:var(--text-primary);
  }
  #radarChart {
    display:block; margin:0 auto; max-width:600px; width:100%;
  }

  /* ===== 域分数表 ===== */
  .scores-section {
    background:var(--bg-card,#fff); border-radius:var(--radius-lg,12px);
    padding:24px; box-shadow:var(--shadow-sm); margin-bottom:20px;
  }
  .scores-section h2 {
    margin:0 0 16px; font-size:18px; color:var(--text-primary);
  }
  .domain-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:12px;
  }
  .domain-card {
    border:1px solid var(--border-light,#e2e8f0); border-radius:var(--radius-md,8px);
    padding:16px; position:relative; overflow:hidden;
  }
  .domain-card::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .domain-card .d-header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
  }
  .domain-card .d-name {
    font-size:15px; font-weight:600; color:var(--text-primary);
  }
  .domain-card .d-en {
    font-size:12px; color:var(--text-muted,#94a3b8); margin:2px 0 6px;
  }
  .domain-card .d-tscore {
    font-size:28px; font-weight:700;
  }
  .domain-card .d-bar {
    height:8px; background:var(--bg-page,#f0f2f5); border-radius:4px;
    overflow:hidden; margin-top:8px;
  }
  .domain-card .d-bar-fill {
    height:100%; border-radius:4px; transition:width .6s ease;
  }
  .domain-card .d-percentile {
    font-size:13px; color:var(--text-muted,#94a3b8); margin-top:4px;
  }

  /* ===== 测验详情表 ===== */
  .details-section {
    background:var(--bg-card,#fff); border-radius:var(--radius-lg,12px);
    padding:24px; box-shadow:var(--shadow-sm); margin-bottom:20px;
  }
  .details-section h2 {
    margin:0 0 16px; font-size:18px; color:var(--text-primary);
  }
  .detail-table { width:100%; border-collapse:collapse; }
  .detail-table th {
    text-align:left; padding:10px 12px; font-size:13px;
    color:var(--text-muted,#94a3b8); border-bottom:2px solid var(--border-light,#e2e8f0);
    white-space:nowrap;
  }
  .detail-table td {
    padding:10px 12px; font-size:14px; color:var(--text-body,#475569);
    border-bottom:1px solid var(--border-light,#e2e8f0);
  }
  .detail-table tr:hover td { background:var(--bg-inst,#f5f3ff); }
  .detail-table .test-name { font-weight:600; color:var(--text-primary); }
  .detail-table .domain-tag {
    display:inline-block; padding:2px 10px; border-radius:var(--radius-pill,20px);
    font-size:12px; color:#fff; white-space:nowrap;
  }
  .detail-table .value-highlight {
    font-weight:600; color:var(--text-primary);
  }

  /* ===== 导出区 ===== */
  .export-bar {
    display:flex; gap:8px; justify-content:flex-end;
    margin-bottom:16px;
  }

  /* ===== 响应式 ===== */
  @media (max-width:768px) {
    #app { padding:12px; }
    .header { flex-direction:column; align-items:stretch; }
    .header select { min-width:unset; }
    .header .actions { justify-content:flex-end; }
    .subject-card { flex-direction:column; align-items:flex-start; }
    .domain-grid { grid-template-columns:1fr; }
    .detail-table { font-size:13px; }
    .detail-table th, .detail-table td { padding:8px 6px; }
  }
  @media (max-width:480px) {
    .header h1 { font-size:18px; }
    .subject-card .info { gap:12px; }
    .subject-card .info-item .value { font-size:20px; }
    .detail-table { display:block; overflow-x:auto; }
  }

  /* ===== 打印样式 ===== */
  @media print {
    .header .actions, .export-bar { display:none; }
    body { background:#fff; }
    #app { max-width:100%; padding:0; }
    .chart-section, .scores-section, .details-section, .subject-card {
      box-shadow:none; break-inside:avoid;
    }
  }
</style>
</head>
<body>

<div id="app">
  <!-- ===== 顶部栏 ===== -->
  <div class="header">
    <h1>🧠 MCCB 综合认知报告 <small id="reportCount"></small></h1>
    <div class="norm-badge" id="normBadge" title="当前采用的分数转换常模"></div>
    <select id="participantSelect" onchange="onSelectParticipant()">
      <option value="">— 选择被试 —</option>
    </select>
    <div class="actions">
      <button class="btn-outline btn-sm" onclick="refreshList()">🔄 刷新</button>
      <button class="btn-primary btn-sm" onclick="exportPDF()">📄 PDF</button>
      <button class="btn-success btn-sm" onclick="exportJSON()">📥 JSON</button>
    </div>
  </div>

  <!-- ===== 空状态 ===== -->
  <div class="empty-state" id="emptyState">
    <div class="icon">📋</div>
    <h2>暂无被试数据</h2>
    <p>请先在首页添加被试并完成至少一项测验后，再来查看综合报告。</p>
    <button class="btn-primary" onclick="window.location.href='index.html'">前往首页</button>
  </div>

  <!-- ===== 报告主体 ===== -->
  <div id="reportArea">
    <!-- 被试信息 -->
    <div class="subject-card" id="subjectCard">
      <div class="info" id="subjectInfo"></div>
      <div class="info" id="subjectStats"></div>
    </div>

    <!-- 导出栏 -->
    <div class="export-bar">
      <button class="btn-outline btn-sm" onclick="copyReport()">📋 复制摘要</button>
    </div>

    <!-- 雷达图 -->
    <div class="chart-section">
      <h2>认知域轮廓</h2>
      <canvas id="radarChart" width="600" height="600"></canvas>
    </div>

    <!-- 域分数 -->
    <div class="scores-section">
      <h2>认知域评分</h2>
      <div class="domain-grid" id="domainGrid"></div>
    </div>

    <!-- 测验详情 -->
    <div class="details-section">
      <h2>各测验原始分数</h2>
      <div style="overflow-x:auto">
        <table class="detail-table" id="detailTable">
          <thead>
            <tr>
              <th>测验</th>
              <th>认知域</th>
              <th>核心指标</th>
              <th>值</th>
            </tr>
          </thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ===== 依赖 ===== -->
<script src="mccb-participant.js"></script>
<script src="mccb-scoring.js"></script>

<script>
  // ============================
  // 雷达图绘制
  // ============================
  function drawRadar(domainData) {
    const canvas = document.getElementById('radarChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const CX = W / 2, CY = H / 2;
    const R = Math.min(W, H) * 0.35;
    const { devicePixelRatio: dpr = 1 } = window;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);

    ctx.clearRect(0, 0, W, H);

    const items = domainData.filter(d => d.tScore != null);
    if (items.length === 0) return;

    const N = items.length;
    const getAngle = (i) => -Math.PI / 2 + (2 * Math.PI * i) / N;

    // --- 同心环（10-80 T分） ---
    const T_MIN = 20, T_MAX = 80;
    const levels = [20, 30, 40, 50, 60, 70, 80];
    const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.08)';
    const textColor = isDark ? '#94a3b8' : '#64748b';

    for (const lv of levels) {
      const r = R * (lv - T_MIN) / (T_MAX - T_MIN);
      ctx.beginPath();
      for (let i = 0; i <= N; i++) {
        const angle = getAngle(i % N);
        const x = CX + r * Math.cos(angle);
        const y = CY + r * Math.sin(angle);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.stroke();

      // 标签（仅外圈）
      if (lv === 80) {
        ctx.fillStyle = textColor;
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(lv + 'T', CX + r + 20, CY + 4);
      }
    }

    // --- 轴线 ---
    for (let i = 0; i < N; i++) {
      const angle = getAngle(i);
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX + R * Math.cos(angle), CY + R * Math.sin(angle));
      ctx.strokeStyle = gridColor;
      ctx.stroke();

      // 标签
      const lx = CX + (R + 40) * Math.cos(angle);
      const ly = CY + (R + 40) * Math.sin(angle);
      ctx.fillStyle = textColor;
      ctx.font = '12px sans-serif';
      ctx.textAlign = angle > Math.PI / 2 - 0.3 && angle < Math.PI * 1.5 - 0.3 ? 'right'
        : angle < -Math.PI / 2 + 0.3 ? 'left' : 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(items[i].label, lx, ly);
    }

    // --- 数据多边形 ---
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const t = Math.max(T_MIN, Math.min(T_MAX, items[i].tScore));
      const r = R * (t - T_MIN) / (T_MAX - T_MIN);
      const angle = getAngle(i);
      const x = CX + r * Math.cos(angle);
      const y = CY + r * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();

    // 填充
    const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);
    grad.addColorStop(0, 'rgba(59,130,246,0.2)');
    grad.addColorStop(1, 'rgba(59,130,246,0.05)');
    ctx.fillStyle = grad;
    ctx.fill();

    // 描边
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // --- 数据点 ---
    for (let i = 0; i < N; i++) {
      const t = Math.max(T_MIN, Math.min(T_MAX, items[i].tScore));
      const r = R * (t - T_MIN) / (T_MAX - T_MIN);
      const angle = getAngle(i);
      const x = CX + r * Math.cos(angle);
      const y = CY + r * Math.sin(angle);
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#3b82f6';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 中心 50T 标注
    ctx.fillStyle = textColor;
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('50T', CX, CY + 3);
  }

  // ============================
  // 报告渲染
  // ============================
  let currentProfile = null;

  function renderProfile(profile) {
    currentProfile = profile;
    if (!profile) {
      document.getElementById('reportArea').classList.remove('visible');
      document.getElementById('emptyState').style.display = 'block';
      return;
    }

    document.getElementById('reportArea').classList.add('visible');
    document.getElementById('emptyState').style.display = 'none';

    const summary = MCCBScoring.getDomainSummary(profile);
    const testsDone = Object.keys(profile.tests).length;

    // 被试信息卡片
    const infoHTML = [
      `<div class="info-item"><div class="value">${profile.id}</div><div class="label">被试编号</div></div>`,
      `<div class="info-item"><div class="value">${testsDone}/10</div><div class="label">完成测验</div></div>`,
    ].join('');
    document.getElementById('subjectInfo').innerHTML = infoHTML;

    if (profile.composite != null) {
      const compositeLabel = profile.composite >= 60 ? '🟢 良好'
        : profile.composite >= 40 ? '🟡 中等' : '🔴 偏低';
      document.getElementById('subjectStats').innerHTML = `
        <div class="info-item"><div class="value">${profile.composite}</div><div class="label">综合 T 分 ${compositeLabel}</div></div>
        <div class="info-item"><div class="value">${summary.length}/7</div><div class="label">认知域</div></div>
      `;
    }

    // 域分数卡
    const gridHTML = summary.map(d => {
      const barPct = ((d.tScore - 20) / 60) * 100;
      return `<div class="domain-card">
        <div class="d-header">
          <div>
            <div class="d-name">${d.label}</div>
            <div class="d-en">${d.labelEn}</div>
          </div>
          <div class="d-tscore" style="color:${d.color}">${d.tScore}</div>
        </div>
        <div class="d-bar"><div class="d-bar-fill" style="width:${Math.max(0, Math.min(100, barPct))}%;background:${d.color}"></div></div>
        <div class="d-percentile">百分位 ${d.percentile}%</div>
      </div>`;
    }).join('');
    document.getElementById('domainGrid').innerHTML = gridHTML;

    // 测验详情表
    const testRows = [];
    for (const [key, t] of Object.entries(profile.tests)) {
      const domainKey = Object.entries(MCCBScoring.DOMAINS).find(([, d]) => d.tests.includes(key))?.[0];
      const domain = domainKey ? MCCBScoring.DOMAINS[domainKey] : null;
      const e = t.extracted;
      let metricStr = '', metricVal = '';

      if (key === 'bacs') {
        metricStr = '正确数'; metricVal = `${e.correct}/${e.attempted} (${e.accuracy}%)`;
      } else if (key === 'fluency') {
        metricStr = '有效数'; metricVal = `${e.unique} 个`;
      } else if (key === 'hvlt') {
        metricStr = '总学习'; metricVal = `${e.totalLearning} (T1:${e.trial1} T2:${e.trial2} T3:${e.trial3})`;
        testRows.push([key, domain, '延迟回忆', `${e.delayedRecall} (保持${e.retention}%)`]);
      } else if (key === 'bvmt') {
        metricStr = '总学习'; metricVal = `${e.totalLearning} (${e.trialsCompleted} 试次)`;
        testRows.push([key, domain, '延迟回忆', `${e.delayedRecall}`]);
      } else if (key === 'cpt') {
        metricStr = "d'"; metricVal = e.dPrime.toFixed(2);
        testRows.push([key, domain, '击中/虚报', `${e.hits}/${e.falseAlarms}`]);
        testRows.push([key, domain, '反应时 (ms)', `击中:${e.meanHitRT} 虚报:${e.meanFART}`]);
      } else if (key === 'msceit') {
        metricStr = '正确率'; metricVal = `${e.correct}/${e.total} (${e.accuracy}%)`;
      } else if (key === 'mazes') {
        metricStr = '总分'; metricVal = `${e.totalScore}/${e.maxScore}`;
      } else if (key === 'spatial-span' || key === 'lns') {
        metricStr = '正确数'; metricVal = `${e.totalCorrect} (最高水平: ${e.maxLevel})`;
      } else if (key === 'tmt') {
        metricStr = '时间 (s)'; metricVal = `A:${e.partATime} B:${e.partBTime}`;
        testRows.push([key, domain, '错误数', `A:${e.partAErrors} B:${e.partBErrors}`]);
      }

      const domainTag = domain
        ? `<span class="domain-tag" style="background:${domain.color}">${domain.label}</span>`
        : '<span style="color:var(--text-muted)">—</span>';

      testRows.unshift([key, domain, metricStr, metricVal]);
    }

    const bodyHTML = testRows.map(([key, domain, metric, val]) => {
      const domainTag = domain
        ? `<span class="domain-tag" style="background:${domain.color}">${domain.label}</span>`
        : '<span style="color:var(--text-muted)">—</span>';
      return `<tr>
        <td class="test-name">${key}</td>
        <td>${domainTag}</td>
        <td>${metric}</td>
        <td class="value-highlight">${val}</td>
      </tr>`;
    }).join('');
    document.getElementById('detailBody').innerHTML = bodyHTML;

    // 雷达图
    drawRadar(summary);
  }

  // ============================
  // 被试选择
  // ============================
  function refreshList() {
    const select = document.getElementById('participantSelect');
    const currentVal = select.value;
    select.innerHTML = '<option value="">— 选择被试 —</option>';

    const data = MCCBScoring.getAllProfiles();
    document.getElementById('reportCount').textContent = `(${data.profiles.length} 人)`;

    // 常模标注（临床透明度）
    const normEl = document.getElementById('normBadge');
    if (data.norm) {
      normEl.textContent = `🛡 ${data.norm.label}`;
      normEl.style.display = 'inline-block';
    } else {
      normEl.style.display = 'none';
    }

    if (data.profiles.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('reportArea').classList.remove('visible');
      return;
    }

    for (const p of data.profiles) {
      const testsDone = Object.keys(p.tests).length;
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.id} (${testsDone}/10)`;
      select.appendChild(opt);
    }

    // 恢复选中的被试
    if (currentVal) {
      select.value = currentVal;
      if (select.value === currentVal) onSelectParticipant();
    }
  }

  function onSelectParticipant() {
    const pid = document.getElementById('participantSelect').value;
    if (!pid) {
      renderProfile(null);
      return;
    }
    const profile = MCCBScoring.getProfile(pid);
    if (!profile) {
      renderProfile(null);
      return;
    }
    // 需要完整数据作域排名
    const all = MCCBScoring.getAllProfiles();
    const fullProfile = all.profiles.find(p => p.id === pid);
    renderProfile(fullProfile || profile);
  }

  // ============================
  // 导出功能
  // ============================
  function exportJSON() {
    const pid = document.getElementById('participantSelect').value;
    if (!pid || !currentProfile) return;
    const blob = new Blob([JSON.stringify(currentProfile, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mccb-report-${pid}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportPDF() {
    window.print();
  }

  function copyReport() {
    if (!currentProfile) return;
    const summary = MCCBScoring.getDomainSummary(currentProfile);
    let text = `MCCB 综合认知报告 — ${currentProfile.id}\n`;
    text += `测验完成: ${Object.keys(currentProfile.tests).length}/10\n`;
    if (currentProfile.composite != null) text += `综合 T 分: ${currentProfile.composite}\n`;
    text += '\n认知域:\n';
    for (const d of summary) {
      text += `  ${d.label}: T=${d.tScore} (百分位 ${d.percentile}%)\n`;
    }
    navigator.clipboard.writeText(text).then(() => alert('摘要已复制到剪贴板'));
  }

  // ============================
  // 初始化
  // ============================
  document.addEventListener('DOMContentLoaded', () => {
    // 监听主题变化重绘雷达图
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentProfile) {
        const summary = MCCBScoring.getDomainSummary(currentProfile);
        drawRadar(summary);
      }
    });
    refreshList();

    // 支持 ?p=ID 深链接直接打开某被试报告
    const deepId = new URLSearchParams(window.location.search).get('p');
    if (deepId) {
      const select = document.getElementById('participantSelect');
      if (select.querySelector(`option[value="${deepId}"]`)) {
        select.value = deepId;
        onSelectParticipant();
      }
    }
  });
</script>

</body>
</html>
