<!doctype html>
<html lang="zh-CN" class="research-app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>研究版多被试对比 · psy-exp</title>
<link rel="stylesheet" href="mccb-common.css">
<link rel="stylesheet" href="research-ui.css">
</head>
<body class="research-app">
<main id="app" class="research-shell wide">
  <header class="app-header">
    <div class="app-title">
      <div class="eyebrow">Cohort comparison</div>
      <h1>研究版多被试对比</h1>
      <p>Protocol-compatible reference groups only · 小样本 rank 显示门槛 N≥5</p>
    </div>
    <nav class="header-actions">
      <button id="allBtn" type="button">选择可评分</button>
      <button id="clearBtn" type="button">清空</button>
      <button id="csvBtn" type="button">导出 CSV</button>
      <button onclick="window.print()" type="button">打印 / PDF</button>
      <a href="research-report.html">单被试报告</a>
      <a href="index.html">返回控制台</a>
    </nav>
  </header>

  <div class="notice"><strong>解释边界：</strong>当前研究模式<strong>未应用经验证的 MCCB 常模</strong>。不同 reference group 的 rank index 不在同一尺度上，因此本页按 <strong>认知域 × reference group</strong> 拆行。reference N&lt;5 时不显示 0–100 rank；N=5–9 时标为探索性。</div>

  <section class="card">
    <div class="section-title"><h2>选择参与者</h2><p id="count"></p></div>
    <div class="toolbar"><input id="searchBox" type="search" placeholder="搜索参与者编号" autocomplete="off"><button id="visibleBtn" type="button">选择搜索结果</button></div>
    <div id="chips" class="chips" style="margin-top:12px"></div>
  </section>

  <section class="section">
    <div class="section-title"><h2>同协议 reference-group 矩阵</h2><p>只在同一行内比较；列可横向滚动</p></div>
    <div id="matrix" class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </section>
  <p class="small" id="foot" style="margin-top:18px"></p>
</main>
<script src="mccb-participant.js"></script>
<script src="mccb-scoring.js"></script>
<script>
'use strict';
const MIN_REFERENCE_N=5,CAUTION_REFERENCE_N=10;let bundle=null,selected=new Set();const $=id=>document.getElementById(id),node=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n};
function mapFor(p){return Object.fromEntries(MCCBScoring.getDomainSummary(p).map(d=>[d.key,d]))}function eligible(p){return Object.keys(p.domains||{}).length>0}function visibleProfiles(){const q=$('searchBox').value.trim().toLowerCase();return bundle.profiles.filter(p=>!q||p.id.toLowerCase().includes(q))}
function load(){bundle=MCCBScoring.getAllProfiles();selected=new Set(bundle.profiles.filter(eligible).map(p=>p.id));renderSelector();render()}
function renderSelector(){const box=$('chips');box.textContent='';visibleProfiles().forEach(p=>{const b=node('button','rui-btn'+(selected.has(p.id)?' soft':'')+(eligible(p)?'':' muted'),p.id);b.type='button';b.disabled=!eligible(p);b.title=eligible(p)?`${Object.keys(p.domains).length} 可评分域`:'当前无可评分域';b.onclick=()=>{selected.has(p.id)?selected.delete(p.id):selected.add(p.id);renderSelector();render()};box.append(b)});$('count').textContent=`已选 ${selected.size} / ${bundle.profiles.filter(eligible).length} 可评分`}
function rows(profiles){const out=[];for(const [domainKey,def] of Object.entries(MCCBScoring.DOMAINS)){const groups=new Map();for(const p of profiles){const d=mapFor(p)[domainKey];if(!d)continue;const key=d.referenceKey||'unknown';if(!groups.has(key))groups.set(key,{domainKey,def,key,referenceN:d.referenceN||null,members:new Map()});groups.get(key).members.set(p.id,d)}for(const g of groups.values())out.push(g)}return out}
function groupLabel(g){const wrap=node('div','');const top=node('div','',g.def.label);top.style.fontWeight='800';const n=node('span','badge',`N=${g.referenceN||'—'}`);n.style.marginLeft='6px';top.append(n);wrap.append(top,node('div','small',g.def.labelEn));if(Number(g.referenceN)<MIN_REFERENCE_N)wrap.append(node('div','rank-suppressed',`N<${MIN_REFERENCE_N}：不显示 rank`));else if(Number(g.referenceN)<CAUTION_REFERENCE_N)wrap.append(node('div','badge research','探索性 / 对样本组成敏感'));const details=node('details','advanced'),sum=node('summary','','reference group signature'),mono=node('div','small mono',g.key);details.append(sum,mono);wrap.append(details);return wrap}
function render(){const profiles=bundle.profiles.filter(p=>selected.has(p.id)&&eligible(p)),head=$('thead'),body=$('tbody');head.textContent='';body.textContent='';const hr=document.createElement('tr');hr.append(node('th','','认知域 / reference group'));profiles.forEach(p=>hr.append(node('th','',p.id)));head.append(hr);const rs=rows(profiles);if(!rs.length){const tr=document.createElement('tr'),td=node('td','empty','请选择至少一名具有可评分域的参与者。');td.colSpan=Math.max(1,profiles.length+1);tr.append(td);body.append(tr)}else rs.forEach(g=>{const tr=document.createElement('tr'),label=document.createElement('td');label.append(groupLabel(g));tr.append(label);profiles.forEach(p=>{const td=document.createElement('td'),d=g.members.get(p.id);if(!d){td.textContent='—';td.className='muted'}else if(Number(g.referenceN)<MIN_REFERENCE_N){td.append(node('div','small','样本不足'));td.title='保留 raw result，但 UI 不展示 0–100 rank'}else{td.append(node('div','rank',String(d.indexScore)));td.append(node('div','rank-note','research cohort rank'));const line=node('div','rank-dotline'),dot=node('span','rank-dot');dot.style.left=Math.max(0,Math.min(100,d.indexScore))+'%';line.append(dot);td.append(line)}tr.append(td)});body.append(tr)});$('foot').textContent=`scoring ${bundle.scoringVersion} · norm ${bundle.norm.version}. 每一行是独立 reference group；样本组成改变时 rank 可变化。UI 显示门槛 N≥${MIN_REFERENCE_N}。`}
function csvEscape(v){const s=String(v==null?'':v);return/[",\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
function exportCsv(){const profiles=bundle.profiles.filter(p=>selected.has(p.id)&&eligible(p)),rs=rows(profiles),lines=[['domain','reference_n','reference_group',...profiles.map(p=>p.id)]];for(const g of rs){lines.push([g.def.label,g.referenceN||'',g.key,...profiles.map(p=>{const d=g.members.get(p.id);return d&&Number(g.referenceN)>=MIN_REFERENCE_N?d.indexScore:''})])}const csv='\uFEFF'+lines.map(r=>r.map(csvEscape).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`psy-exp-comparison-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url)}
$('searchBox').addEventListener('input',renderSelector);$('visibleBtn').onclick=()=>{visibleProfiles().filter(eligible).forEach(p=>selected.add(p.id));renderSelector();render()};$('allBtn').onclick=()=>{selected=new Set(bundle.profiles.filter(eligible).map(p=>p.id));renderSelector();render()};$('clearBtn').onclick=()=>{selected.clear();renderSelector();render()};$('csvBtn').onclick=exportCsv;document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
