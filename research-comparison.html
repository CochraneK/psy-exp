<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCCB 多被试对比报告</title>
<link rel="stylesheet" href="mccb-common.css">
<style>
body{margin:0;background:var(--bg-page,#f0f2f5);min-height:100vh}#app{max-width:1400px;margin:0 auto;padding:24px}.header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border-radius:12px;padding:16px 24px;box-shadow:var(--shadow-sm);margin-bottom:24px}.header h1{margin:0;font-size:22px;color:#1e293b;flex:1}.header h1 small{font-size:14px;font-weight:400;color:#94a3b8;margin-left:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.btn{padding:8px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer}.btn-primary{background:#3b82f6;color:#fff}.btn-outline{background:transparent;color:#334155;border:2px solid #e2e8f0}.btn-success{background:#16a34a;color:#fff}.empty-state{text-align:center;padding:80px 24px;color:#94a3b8}.empty-state .icon{font-size:64px;margin-bottom:16px}.selection-section,.chart-section,.table-section{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:var(--shadow-sm);margin-bottom:20px}.selection-section h2,.chart-section h2,.table-section h2{margin:0 0 12px;font-size:17px;color:#1e293b}.participant-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.participant-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border:2px solid #e2e8f0;border-radius:999px;cursor:pointer;font-size:13px;background:#fff;color:#1e293b}.participant-chip.selected{border-color:#3b82f6;background:#3b82f6;color:#fff}.participant-chip.disabled{opacity:.45;cursor:not-allowed}.chip-count{font-size:13px;color:#64748b}.comparison-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.chart-section{margin-bottom:20px}#comparisonRadar{display:block;margin:0 auto;max-width:600px;width:100%}.radar-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.legend-item{display:flex;align-items:center;gap:4px;font-size:12px;color:#64748b}.legend-swatch{width:12px;height:12px;border-radius:3px;display:inline-block}.table-section{overflow-x:auto}.comp-table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}.comp-table th{text-align:center;padding:8px 10px;font-weight:600;color:#1e293b;border-bottom:2px solid #e2e8f0}.comp-table th:first-child{text-align:left}.comp-table td{text-align:center;padding:7px 10px;color:#475569;border-bottom:1px solid #e2e8f0}.comp-table td:first-child{text-align:left;font-weight:600;color:#1e293b}.rank-cell{display:inline-block;min-width:38px;padding:2px 6px;border-radius:4px;background:#eff6ff;color:#1d4ed8;font-weight:600}.muted{color:#94a3b8}.guard-note{font-size:12px;color:#64748b;line-height:1.7;margin:8px 0 0}.stats-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.stat-card{border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;text-align:center}.stat-label{font-size:12px;color:#94a3b8;margin-bottom:4px}.stat-value{font-size:22px;font-weight:700;color:#1e293b}.stat-detail{font-size:11px;color:#94a3b8;margin-top:2px}@media(max-width:1024px){.comparison-layout{grid-template-columns:1fr}}@media(max-width:768px){#app{padding:12px}.header{flex-direction:column;align-items:stretch}.comp-table{font-size:12px}}@media print{.header .actions,.selection-section{display:none}body{background:#fff}#app{max-width:100%;padding:0}.chart-section,.table-section{box-shadow:none;break-inside:avoid}.comparison-layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="header"><h1>📊 MCCB 多被试对比 <small id="reportCount"></small></h1><div class="actions"><button class="btn-outline" id="allBtn">✅ 全选可评分</button><button class="btn-outline" id="clearBtn">✖ 清空</button><button class="btn-primary" id="csvBtn">📥 CSV</button><button class="btn-success" onclick="window.print()">📄 打印</button><button class="btn-outline" onclick="location.href='index.html'">🏠 首页</button></div></div>
  <div class="empty-state" id="emptyState"><div class="icon">📊</div><h2>暂无被试数据</h2><p>请先在首页添加被试并完成至少一项有效测验。</p></div>
  <div id="mainContent" hidden>
    <div class="selection-section"><h2>选择被试 <span class="chip-count" id="chipCount"></span></h2><div class="participant-grid" id="participantGrid"></div><p class="guard-note">仅对 QC-valid、protocol-compatible 且 reference N≥5 的项目内排名指数进行展示。不同 reference group 不会被当作同一尺度比较。</p></div>
    <div class="comparison-layout"><div class="chart-section"><h2>认知域轮廓叠加</h2><canvas id="comparisonRadar" width="600" height="600"></canvas><div class="radar-legend" id="radarLegend"></div><p class="guard-note">雷达图只保留所有已选参与者都处在相同 reference group 的认知域。</p></div><div class="table-section"><h2>认知域项目内排名</h2><table class="comp-table"><thead><tr id="compTableHead"><th>认知域 / reference group</th></tr></thead><tbody id="compTableBody"></tbody></table></div></div>
    <div class="table-section"><h2>组摘要</h2><div class="stats-summary" id="statsSummary"></div></div>
  </div>
</div>
<script src="mccb-participant.js"></script>
<script src="mccb-scoring.js"></script>
<script>
'use strict';
const MIN_REFERENCE_N=5;let bundle=null,selected=new Set();const $=id=>document.getElementById(id);const COLORS=['#3b82f6','#ef4444','#22c55e','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316'];
function summaryMap(p){return Object.fromEntries(MCCBScoring.getDomainSummary(p).map(d=>[d.key,d]))}
function eligible(p){return MCCBScoring.getDomainSummary(p).some(d=>Number(d.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore))}
function renderSelector(){const grid=$('participantGrid');grid.innerHTML='';for(const p of bundle.profiles){const ok=eligible(p),chip=document.createElement('div');chip.className='participant-chip'+(selected.has(p.id)?' selected':'')+(ok?'':' disabled');chip.textContent=`${p.id} (${Object.keys(p.tests).length}/10)`;if(ok)chip.onclick=()=>{selected.has(p.id)?selected.delete(p.id):selected.add(p.id);renderSelector();render()};grid.appendChild(chip)}$('chipCount').textContent=`(${selected.size} 人已选)`}
function groupedRows(profiles){const rows=[];for(const[key,def]of Object.entries(MCCBScoring.DOMAINS)){const groups=new Map();for(const p of profiles){const d=summaryMap(p)[key];if(!d)continue;const ref=d.referenceKey||'unknown';if(!groups.has(ref))groups.set(ref,{key,def,referenceKey:ref,referenceN:d.referenceN||0,members:new Map()});groups.get(ref).members.set(p.id,d)}for(const g of groups.values())rows.push(g)}return rows}
function comparableDomains(profiles){const out=[];if(profiles.length<1)return out;for(const[key,def]of Object.entries(MCCBScoring.DOMAINS)){const ds=profiles.map(p=>summaryMap(p)[key]);if(ds.some(d=>!d||Number(d.referenceN)<MIN_REFERENCE_N||!Number.isFinite(d.indexScore)))continue;const refs=new Set(ds.map(d=>d.referenceKey||''));if(refs.size!==1)continue;out.push({key,def,ds})}return out}
function drawRadar(profiles){const canvas=$('comparisonRadar'),ctx=canvas.getContext('2d'),W=600,H=600,CX=300,CY=300,R=205;canvas.width=W;canvas.height=H;ctx.clearRect(0,0,W,H);$('radarLegend').innerHTML='';const domains=comparableDomains(profiles);if(!profiles.length||!domains.length){ctx.fillStyle='#94a3b8';ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText('当前没有可在同一 reference group 内直接比较的认知域',CX,CY);return}const N=domains.length,angle=i=>-Math.PI/2+2*Math.PI*i/N;ctx.strokeStyle='rgba(0,0,0,.08)';ctx.fillStyle='#64748b';ctx.font='11px sans-serif';for(const lv of[20,40,60,80,100]){const r=R*lv/100;ctx.beginPath();for(let i=0;i<=N;i++){const a=angle(i%N),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke()}domains.forEach((d,i)=>{const a=angle(i);ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+R*Math.cos(a),CY+R*Math.sin(a));ctx.stroke();ctx.textAlign=Math.cos(a)>.25?'left':Math.cos(a)<-.25?'right':'center';ctx.fillText(d.def.label,CX+(R+25)*Math.cos(a),CY+(R+25)*Math.sin(a))});profiles.forEach((p,pi)=>{const color=COLORS[pi%COLORS.length];ctx.beginPath();domains.forEach((d,i)=>{const val=d.ds[pi].indexScore,r=R*val/100,a=angle(i),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();const item=document.createElement('div');item.className='legend-item';item.innerHTML=`<span class="legend-swatch" style="background:${color}"></span>${p.id}`;$('radarLegend').appendChild(item)})}
function renderTable(profiles){const head=$('compTableHead'),body=$('compTableBody');head.innerHTML='<th>认知域 / reference group</th>';profiles.forEach(p=>head.insertAdjacentHTML('beforeend',`<th>${p.id}</th>`));body.innerHTML='';const rows=groupedRows(profiles);if(!rows.length){body.innerHTML=`<tr><td colspan="${profiles.length+1}" class="muted">请选择至少一名具有可评分认知域的参与者。</td></tr>`;return}for(const g of rows){const tr=document.createElement('tr');tr.insertAdjacentHTML('beforeend',`<td>${g.def.label}<div class="muted" style="font-size:11px">N=${g.referenceN} · ${g.referenceKey.slice(0,38)}</div></td>`);for(const p of profiles){const d=g.members.get(p.id),ok=d&&Number(g.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore);tr.insertAdjacentHTML('beforeend',`<td>${ok?`<span class="rank-cell">${Math.round(d.indexScore*10)/10}</span>`:'—'}</td>`)}body.appendChild(tr)}}
function renderStats(profiles){const s=$('statsSummary');s.innerHTML='';const comparable=comparableDomains(profiles).length,eligibleCount=profiles.filter(eligible).length;s.innerHTML=`<div class="stat-card"><div class="stat-label">已选参与者</div><div class="stat-value">${profiles.length}</div><div class="stat-detail">当前展示</div></div><div class="stat-card"><div class="stat-label">可评分参与者</div><div class="stat-value">${eligibleCount}</div><div class="stat-detail">至少一个 N≥5 域</div></div><div class="stat-card"><div class="stat-label">可直接叠加认知域</div><div class="stat-value">${comparable}</div><div class="stat-detail">相同 reference group</div></div>`}
function render(){const profiles=bundle.profiles.filter(p=>selected.has(p.id)&&eligible(p));renderTable(profiles);drawRadar(profiles);renderStats(profiles)}
function load(){bundle=MCCBScoring.getAllProfiles();$('reportCount').textContent=`(${bundle.profiles.length} 人)`;$('emptyState').style.display=bundle.profiles.length?'none':'block';$('mainContent').hidden=!bundle.profiles.length;selected=new Set(bundle.profiles.filter(eligible).map(p=>p.id));renderSelector();render()}
function exportCsv(){const profiles=bundle.profiles.filter(p=>selected.has(p.id)&&eligible(p)),rows=groupedRows(profiles),esc=v=>{const s=String(v??'');return/[",\n]/.test(s)?'"'+s.replaceAll('"','""')+'"':s};const lines=[['domain','reference_n','reference_group',...profiles.map(p=>p.id)]];for(const g of rows)lines.push([g.def.label,g.referenceN,g.referenceKey,...profiles.map(p=>{const d=g.members.get(p.id);return d&&Number(g.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore)?Math.round(d.indexScore*10)/10:''})]);const blob=new Blob(['\uFEFF'+lines.map(r=>r.map(esc).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cognitive-comparison-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url)}
$('allBtn').onclick=()=>{selected=new Set(bundle.profiles.filter(eligible).map(p=>p.id));renderSelector();render()};$('clearBtn').onclick=()=>{selected.clear();renderSelector();render()};$('csvBtn').onclick=exportCsv;document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
