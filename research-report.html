<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCCB 综合认知报告</title>
<link rel="stylesheet" href="mccb-common.css">
<style>
body{margin:0;background:var(--bg-page,#f0f2f5);min-height:100vh}#app{max-width:1200px;margin:0 auto;padding:24px}.header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--bg-card,#fff);border-radius:12px;padding:16px 24px;box-shadow:var(--shadow-sm);margin-bottom:24px}.header h1{margin:0;font-size:22px;color:var(--text-primary,#1a1a2e);flex:1}.header h1 small{font-size:14px;font-weight:400;color:#94a3b8;margin-left:8px}.header select{padding:8px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:15px;background:#fff;color:#1e293b;min-width:200px}.header .actions{display:flex;gap:8px}.header button,.btn{padding:8px 18px;border:none;border-radius:8px;font-size:14px;cursor:pointer}.btn-primary{background:#3b82f6;color:#fff}.btn-outline{background:transparent;color:#334155;border:2px solid #e2e8f0}.btn-success{background:#16a34a;color:#fff}.norm-badge{font-size:12px;color:#64748b;background:#fef3c7;border:1px solid #e2e8f0;border-radius:999px;padding:3px 10px}.empty-state{text-align:center;padding:80px 24px;color:#94a3b8}.empty-state .icon{font-size:64px;margin-bottom:16px}.subject-card,.chart-section,.scores-section,.details-section{background:#fff;border-radius:12px;padding:20px 24px;box-shadow:var(--shadow-sm);margin-bottom:20px}.subject-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.info{display:flex;gap:24px;flex-wrap:wrap}.info-item{text-align:center}.info-item .value{font-size:24px;font-weight:700;color:#1e293b}.info-item .label{font-size:13px;color:#94a3b8;margin-top:2px}.chart-section h2,.scores-section h2,.details-section h2{margin:0 0 16px;font-size:18px;color:#1e293b}#radarChart{display:block;margin:0 auto;max-width:600px;width:100%}.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.domain-card{border:1px solid #e2e8f0;border-radius:8px;padding:16px;position:relative;overflow:hidden}.domain-card .d-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.domain-card .d-name{font-size:15px;font-weight:600;color:#1e293b}.domain-card .d-en{font-size:12px;color:#94a3b8;margin:2px 0 6px}.domain-card .d-score{font-size:28px;font-weight:700}.domain-card .d-bar{height:8px;background:#f0f2f5;border-radius:4px;overflow:hidden;margin-top:8px}.domain-card .d-bar-fill{height:100%;border-radius:4px}.domain-card .d-note{font-size:12px;color:#64748b;margin-top:5px}.detail-table{width:100%;border-collapse:collapse}.detail-table th{text-align:left;padding:10px 12px;font-size:13px;color:#94a3b8;border-bottom:2px solid #e2e8f0}.detail-table td{padding:10px 12px;font-size:14px;color:#475569;border-bottom:1px solid #e2e8f0;vertical-align:top}.detail-table .test-name{font-weight:600;color:#1e293b}.domain-tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;background:#64748b;color:#fff}.guard-note{font-size:12px;color:#64748b;line-height:1.7;margin:0}.export-bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:16px}@media(max-width:768px){#app{padding:12px}.header{flex-direction:column;align-items:stretch}.header select{min-width:unset}.domain-grid{grid-template-columns:1fr}.detail-table{display:block;overflow-x:auto}}@media print{.header .actions,.export-bar{display:none}body{background:#fff}#app{max-width:100%;padding:0}.subject-card,.chart-section,.scores-section,.details-section{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🧠 MCCB 综合认知报告 <small id="reportCount"></small></h1>
    <div class="norm-badge" id="normBadge">项目内研究指标 · 非临床常模</div>
    <select id="participantSelect" aria-label="选择被试"><option value="">— 选择被试 —</option></select>
    <div class="actions"><button class="btn-outline" id="refreshBtn">🔄 刷新</button><button class="btn-primary" onclick="window.print()">📄 PDF</button><button class="btn-success" id="jsonBtn">📥 JSON</button><button class="btn-outline" onclick="location.href='index.html'">🏠 首页</button></div>
  </div>
  <div class="empty-state" id="emptyState"><div class="icon">📋</div><h2>暂无被试数据</h2><p>请先在首页添加被试并完成至少一项测验。</p></div>
  <div id="reportArea" hidden>
    <div class="subject-card"><div class="info" id="subjectInfo"></div><div class="info" id="subjectStats"></div></div>
    <div class="export-bar"><button class="btn btn-outline" id="copyBtn">📋 复制摘要</button></div>
    <div class="chart-section"><h2>认知域轮廓</h2><canvas id="radarChart" width="600" height="600"></canvas><p class="guard-note">仅显示 QC-valid、protocol-compatible 且 reference N≥5 的项目内排名指数。不是 MCCB T 分、临床百分位或诊断结论。</p></div>
    <div class="scores-section"><h2>认知域研究指标</h2><div class="domain-grid" id="domainGrid"></div></div>
    <div class="details-section"><h2>各测验原始分数</h2><div style="overflow-x:auto"><table class="detail-table"><thead><tr><th>测验</th><th>认知域</th><th>核心指标</th><th>QC</th></tr></thead><tbody id="detailBody"></tbody></table></div></div>
  </div>
</div>
<script src="mccb-participant.js"></script>
<script src="mccb-scoring.js"></script>
<script>
'use strict';
const MIN_REFERENCE_N=5;let bundle=null,currentProfile=null;const $=id=>document.getElementById(id);const fmt=v=>v==null||v===''?'—':typeof v==='number'&&Number.isFinite(v)?(Number.isInteger(v)?String(v):v.toFixed(2)):String(v);
function metricText(k,e){if(!e)return'—';switch(k){case'tmt':return`Part A ${fmt(e.partATime)} s · errors ${fmt(e.partAErrors)}`;case'bacs':return`correct ${fmt(e.correct)} / attempted ${fmt(e.attempted)}`;case'fluency':return`unique ${fmt(e.unique)} · review ${e.reviewStatus||'—'}`;case'cpt':return`d′ ${fmt(e.dPrime)} · hits ${fmt(e.hits)} · FA ${fmt(e.falseAlarms)} · RT ${fmt(e.meanHitRT)} ms`;case'spatial-span':case'lns':return`correct ${fmt(e.totalCorrect)} · max ${fmt(e.maxLevel)}`;case'hvlt':case'bvmt':return`learning ${fmt(e.totalLearning)} · delayed ${fmt(e.delayedRecall)}`;case'mazes':return`score ${fmt(e.totalScore)} · completed ${fmt(e.completed)}`;case'msceit':return`raw ${fmt(e.rawScore)} · correct ${fmt(e.correct)} / ${fmt(e.total)}`;default:return'raw result'}}
function renderInfo(){const q=currentProfile.qcSummary||{},domains=MCCBScoring.getDomainSummary(currentProfile);$('subjectInfo').innerHTML=`<div class="info-item"><div class="value">${currentProfile.id}</div><div class="label">被试编号</div></div><div class="info-item"><div class="value">${Object.keys(currentProfile.tests).length}/10</div><div class="label">已有结果</div></div>`;$('subjectStats').innerHTML=`<div class="info-item"><div class="value">${q.valid||0}</div><div class="label">QC valid</div></div><div class="info-item"><div class="value">${domains.filter(d=>Number(d.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore)).length}</div><div class="label">可展示认知域</div></div>`}
function drawRadar(domains){const canvas=$('radarChart'),ctx=canvas.getContext('2d'),W=600,H=600,CX=300,CY=300,R=210;canvas.width=W;canvas.height=H;ctx.clearRect(0,0,W,H);const items=domains.filter(d=>Number(d.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore));if(!items.length){ctx.fillStyle='#94a3b8';ctx.font='15px sans-serif';ctx.textAlign='center';ctx.fillText('当前暂无满足 N≥5 与 QC/protocol 条件的认知域',CX,CY);return}const N=items.length,angle=i=>-Math.PI/2+2*Math.PI*i/N;ctx.strokeStyle='rgba(0,0,0,.08)';ctx.fillStyle='#64748b';ctx.font='11px sans-serif';for(const lv of[20,40,60,80,100]){const r=R*lv/100;ctx.beginPath();for(let i=0;i<=N;i++){const a=angle(i%N),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke()}for(let i=0;i<N;i++){const a=angle(i);ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+R*Math.cos(a),CY+R*Math.sin(a));ctx.stroke();ctx.textAlign=Math.cos(a)>.25?'left':Math.cos(a)<-.25?'right':'center';ctx.fillText(items[i].label,CX+(R+25)*Math.cos(a),CY+(R+25)*Math.sin(a))}ctx.beginPath();items.forEach((d,i)=>{const r=R*d.indexScore/100,a=angle(i),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(59,130,246,.18)';ctx.strokeStyle='#3b82f6';ctx.lineWidth=2.5;ctx.fill();ctx.stroke()}
function renderDomains(){const domains=MCCBScoring.getDomainSummary(currentProfile),grid=$('domainGrid');grid.innerHTML='';if(!domains.length){grid.innerHTML='<div style="color:#94a3b8">暂无满足研究评分条件的完整认知域。</div>';drawRadar([]);return}for(const d of domains){const ok=Number(d.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore),score=ok?Math.round(d.indexScore*10)/10:'—',bar=ok?Math.max(0,Math.min(100,d.indexScore)):0;grid.insertAdjacentHTML('beforeend',`<div class="domain-card"><div class="d-header"><div><div class="d-name">${d.label}</div><div class="d-en">${d.labelEn}</div></div><div class="d-score" style="color:${d.color}">${score}</div></div><div class="d-bar"><div class="d-bar-fill" style="width:${bar}%;background:${d.color}"></div></div><div class="d-note">${ok?`项目内排名指数 · reference N=${d.referenceN}`:`样本不足或不可评分 · reference N=${d.referenceN||0}`}</div></div>`)}drawRadar(domains)}
function renderDetails(){const body=$('detailBody');body.innerHTML='';for(const[k,t]of Object.entries(currentProfile.tests)){const domain=Object.values(MCCBScoring.DOMAINS).find(d=>d.tests.includes(k)),label=k==='tmt'?`${t.label} / Trail Making`:t.label;body.insertAdjacentHTML('beforeend',`<tr><td class="test-name">${label}</td><td><span class="domain-tag">${domain?domain.label:'—'}</span></td><td>${metricText(k,t.extracted)}</td><td>${t.qcStatus}${t.eligibleForResearchScoring?' · eligible':` · excluded${t.ineligibilityReason?' ('+t.ineligibilityReason+')':''}`}</td></tr>`)}}
function render(){const id=$('participantSelect').value;currentProfile=bundle&&bundle.profiles.find(p=>p.id===id)||null;$('emptyState').style.display=currentProfile?'none':'block';$('reportArea').hidden=!currentProfile;if(!currentProfile)return;renderInfo();renderDomains();renderDetails()}
function load(){bundle=MCCBScoring.getAllProfiles();const s=$('participantSelect'),wanted=new URLSearchParams(location.search).get('p')||s.value;s.innerHTML='<option value="">— 选择被试 —</option>';for(const p of bundle.profiles){const o=document.createElement('option');o.value=p.id;o.textContent=`${p.id} · ${Object.keys(p.tests).length}/10`;s.appendChild(o)}if(wanted&&bundle.profiles.some(p=>p.id===wanted))s.value=wanted;else if(bundle.profiles.length===1)s.value=bundle.profiles[0].id;$('reportCount').textContent=`(${bundle.profiles.length} 人)`;$('normBadge').textContent=`🛡 ${bundle.norm.label||'项目内研究指标'} · 非临床常模`;render()}
function exportJson(){if(!currentProfile)return;const payload={reportType:'research-safe-original-ui',generatedAt:new Date().toISOString(),scoringVersion:bundle.scoringVersion,norm:bundle.norm,profile:currentProfile};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cognitive-report-${currentProfile.id}.json`;a.click();URL.revokeObjectURL(url)}
function copySummary(){if(!currentProfile)return;const ds=MCCBScoring.getDomainSummary(currentProfile).filter(d=>Number(d.referenceN)>=MIN_REFERENCE_N&&Number.isFinite(d.indexScore));const text=[`被试: ${currentProfile.id}`,`QC valid: ${(currentProfile.qcSummary||{}).valid||0}`, ...ds.map(d=>`${d.label}: 项目内排名指数 ${Math.round(d.indexScore*10)/10} (N=${d.referenceN})`),'注：非 MCCB T 分/临床百分位。'].join('\n');navigator.clipboard.writeText(text).then(()=>alert('摘要已复制'))}
$('participantSelect').addEventListener('change',render);$('refreshBtn').onclick=load;$('jsonBtn').onclick=exportJson;$('copyBtn').onclick=copySummary;document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
